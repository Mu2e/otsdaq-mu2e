<!DOCTYPE HTML>
<html lang="en">
<head>
    <title>DCS Monitoring Home</title>

    <link href='/WebPath/css/fonts.css?family=Inconsolata:400' rel='stylesheet' type='text/css'>
    <link href='/WebPath/css/fonts.css?family=Comfortaa:400' rel='stylesheet' type='text/css'>
    <link rel="stylesheet" type="text/css" href="/WebPath/UserWebPath/css/DCSMonitoringPages/DCSMonitoringHome.css">

    <script type="text/JavaScript" src="/WebPath/js/Globals.js"></script>
    <script type="text/JavaScript" src="/WebPath/js/Debug.js"></script>
    <script type="text/JavaScript" src="/WebPath/js/DesktopContent.js"></script>

    <script>

        //functions:
        //	init()
        //	makeTiles()
        //	navigateToPage(url)
        //
        /////////////////////////////////////////////////////////////////////////////////////////
        /////////////////////////////////////////////////////////////////////////////////////////

        var PAGES_PATH = "/WebPath/UserWebPath/html/DCSMonitoringPages/";

        //one tile per subsystem: without a url the subsystem has no page yet,
        //	the urls must be the same as in the menu of DCSMonitoring.html to have the menu entry selected
        var SUBSYSTEMS = [
            { name: "Beam info" },
            { name: "Magnetic field" },
            { name: "Trigger" },
            { name: "DAQ", url: PAGES_PATH + "daq/DaqRoomHealth.html" },
            { name: "STM" },
            { name: "ExtMon" },
            { name: "Tracker" },
            { name: "Calorimeter", url: PAGES_PATH + "DetectorView.html?view=calorimeter",
                image: "/WebPath/UserWebPath/images/calorimeter_preview.jpg" },
            { name: "CRV" },
        ];


        //=====================================================================================
        //init called once body has loaded
        function init() {
            Debug.log("init() was called");
            makeTiles();
        } //end init()

        //=====================================================================================
        //makeTiles ~~
        //	builds one tile for each entry of SUBSYSTEMS
        function makeTiles() {
            var tilesEl = document.getElementById("tiles");

            for (var i = 0; i < SUBSYSTEMS.length; ++i) {
                var tileEl = tilesEl.appendChild(document.createElement("button"));
                tileEl.className = "tile";
                tileEl.disabled = !SUBSYSTEMS[i].url;
                if (SUBSYSTEMS[i].url)
                    tileEl.onclick = navigateToPage.bind(null, SUBSYSTEMS[i].url);

                var nameEl = tileEl.appendChild(document.createElement("div"));
                nameEl.className = "tileName";
                nameEl.textContent = SUBSYSTEMS[i].name;

                var previewEl = tileEl.appendChild(document.createElement("div"));
                previewEl.className = "tilePreview";
                if (SUBSYSTEMS[i].image) {
                    var imageEl = previewEl.appendChild(document.createElement("img"));
                    imageEl.src = SUBSYSTEMS[i].image;
                    imageEl.alt = "";
                }
                else
                    previewEl.textContent = SUBSYSTEMS[i].url ? "open page" : "no page yet";
            }
        } //end makeTiles()

        //=====================================================================================
        //navigateToPage ~~
        //	opens url through DCSMonitoring.html, to keep its menu up to date,
        //	or directly here if this page is not inside DCSMonitoring.html
        function navigateToPage(url) {
            var parentOpenPage;
            try {
                parentOpenPage = window.parent != window && window.parent.openPage;
            }
            catch (e) {
                Debug.log("No access to the parent window: " + e);
            }

            if (parentOpenPage)
                parentOpenPage(url);
            else
                window.location.href = url;
        } //end navigateToPage()

    </script>
</head>

<body onload='//init() called by DesktopContent.js'>

    <div id="summary">Select a subsystem</div>
    <div id="tiles"></div>

</body>
</html>
