<!DOCTYPE HTML>
<html lang="en">
<head>
    <title>DAQ room health</title>

    <link href='/WebPath/css/fonts.css?family=Inconsolata:400' rel='stylesheet' type='text/css'>
    <link href='/WebPath/css/fonts.css?family=Comfortaa:400' rel='stylesheet' type='text/css'>
    <link rel="stylesheet" type="text/css" href="/WebPath/UserWebPath/css/DCSMonitoringPages/DaqRoomHealth.css">

    <script type="text/JavaScript" src="/WebPath/js/Globals.js"></script>
    <script type="text/JavaScript" src="/WebPath/js/Debug.js"></script>
    <script type="text/JavaScript" src="/WebPath/js/DesktopContent.js"></script>
    <script type="text/JavaScript" src="/WebPath/UserWebPath/js/DCSChart.js"></script>

    <script>

        //functions:
        //	init()
        //	addEl(parentEl, tag, className, text)
        //
        //	racks, live values:
        //		makeRacks()
        //		makeRack(parentEl, rack)
        //		dtcCount(node)
        //		makeWidget(parentEl, kind, pvName)
        //		updateWidget(pvName)
        //		drawGraph(pvName)
        //		getPvSettings()
        //		pvSettingsHandler(req)
        //		generateUID()
        //		generateUIDHandler(req, reqParam, errStr)
        //		pollServer()
        //		pollServerHandler(req, reqParam, errStr)
        //		showStatus(problem)
        //
        //	DTC temperature trends, read from the archiver database (charts of DCSChart.js):
        //		makeRangeButtons()
        //		addTrendSeries(chart, rack, node, color, group)
        //		makeRackChart(rackEl, rack)
        //		makeSideChart(parentEl, side, title)
        //		highlightRack(rack)
        //		trendChartDrawn(chart, readout)
        //		setTrendRange(seconds)
        //		zoomTrends(fromTime, toTime)
        //		fetchTrends()
        //		trendSeriesHandler(pv, reply, errStr)
        //		trendDoneHandler()
        //		drawTrendCharts()
        //
        //====================== start high-level behavior description
        //
        //	- init() is called by DesktopContent.js:
        //		* makeRacks() builds the racks and one widget for each pv
        //		* getPvSettings() gets units and limits of the pvs, for the tooltips
        //		* generateUID() registers the pv list at the server, then pollServer() is
        //			called periodically: only the pvs that changed are returned and updateWidget()
        //			shows value and severity
        //		* the DTC temperatures are shown in a small chart below each rack (one color for each node)
        //			and in one chart for each side of the room (one color for each rack):
        //			fetchTrends() periodically reads their history from the archiver
        //
        //====================== end high-level behavior description
        //
        /////////////////////////////////////////////////////////////////////////////////////////
        /////////////////////////////////////////////////////////////////////////////////////////

        var POLL_PERIOD_MS = 15000;
        var STALE_SECONDS = 86400; 			//a pv not updated for longer is shown as stale

        //the room: two rows of racks, each rack has a protection state, temperature sensors,
        //	two PDUs with three phases and the shelves with the nodes
        var SIDES = [["E", "East racks"], ["W", "West racks"]];
        var RACK_COUNT = 7;
        var SHELF_COUNT = 11; 				//the first shelf is the one of the PDUs
        var RACK_TEMPERATURE_COUNT = 3;
        var PDU_PHASE_COUNT = 3;
        var DTC_SLOT_COUNT = 2; 			//DTC temperature slots in each shelf
        var DTC_COUNT_BY_KIND = { "trk": 2, "calo": 2, "crv": 1, "cfo": 1, "stm": 1, "extmon": 1 }; //node name prefix => DTCs, others have none
        var RACKS_WITHOUT_LEFT_PDU = ["2E", "4E", "6E", "7E", "6W", "7W"];

        //the nodes of each rack, from the bottom shelf up
        //	(positions and DTC counts from docdb-37376 RelayRackInfo_TDAQ)
        var RACK_NODES = {
            "2E": ["trk-15", "trk-16", "trk-17", "trk-18", "cfo-01"],
            "3E": ["trk-11", "trk-12", "trk-13", "trk-14", "dl-01", "dl-02", "dcs-03", "dcs-01", "dcs-02", "mgr-01"],
            "1W": ["calo-01", "calo-02", "calo-03", "calo-04", "calo-05", "calo-06", "calo-07", "calo-08", "extmon-01"],
            "2W": ["calo-09", "calo-10", "calo-11", "calo-12", "stm-02", "stm-01"],
            "3W": ["calo-13", "calo-14", "trk-09", "trk-10", "crv-03"],
            "4W": ["trk-05", "trk-06", "trk-07", "trk-08", "crv-02"],
            "5W": ["trk-01", "trk-02", "trk-03", "trk-04", "crv-01"],
        };

        var SEVERITY_CLASS = { "NO_ALARM": "ok", "MINOR": "minor", "MAJOR": "major", "INVALID": "invalid" };

        var _widgets = {}; 		//pv name => { el, kind, value, time, status, severity }
        var _pvSettings = {}; 	//pv name => { Units, Upper_Alarm_Limit, ... }
        var _rackEls = {}; 		//rack => element
        var _uid = "";
        var _pollTimer = 0;
        var _lastPollTime = 0;

        //trend charts
        var RANGE_PRESETS = [["1 h", 3600], ["6 h", 21600], ["24 h", 86400], ["7 d", 604800], ["30 d", 2592000]];
        var TREND_DEFAULT_SECONDS = 86400;
        var TREND_VALID_RANGE = [-50, 200]; //degrees, a temperature out of this range is a bad reading and is not plotted
        var TREND_REFRESH_MS = 60000; 		//at least, a long time range is refreshed less often

        var _trendCharts = []; 	//the charts of the racks and of the sides, each also has noteEl and idleNote
        var _sideCharts = [];
        var _trendSeries = {}; 	//pv name => array of the series (of different charts) that show it
        var _trend = {
            seconds: TREND_DEFAULT_SECONDS, 	//the charts show the last seconds, or 0 if they show the fixed time range
            viewFrom: 0, viewTo: 0, 			//	selected with the mouse
            batch: null, timer: 0, loading: false, problem: "", units: ""
        };


        //=====================================================================================
        //init called once body has loaded
        function init() {
            Debug.log("init() was called");

            makeRacks();
            getPvSettings();
            generateUID();

            makeRangeButtons();
            for (var s = 0; s < SIDES.length; ++s)
                makeSideChart(document.getElementById("charts"), SIDES[s][0], SIDES[s][1]);
            window.addEventListener("resize", drawTrendCharts);
            setTrendRange(_trend.seconds);
        } //end init()

        //=====================================================================================
        //addEl ~~
        //	returns a new element appended to parentEl
        function addEl(parentEl, tag, className, text) {
            var el = parentEl.appendChild(document.createElement(tag));
            if (className) el.className = className;
            if (text !== undefined) el.textContent = text;
            return el;
        } //end addEl()

        /////////////////////////////////////////////////////////////////////////////////////////
        //racks, live values

        //=====================================================================================
        //makeRacks ~~
        //	builds one row of racks for each side of the room
        function makeRacks() {
            var racksEl = document.getElementById("racks");

            for (var s = 0; s < SIDES.length; ++s) {
                var side = SIDES[s][0];

                addEl(addEl(racksEl, "div", "sectionHead"), "span", "sectionTitle", SIDES[s][1]);
                var rowEl = addEl(racksEl, "div", "rackRow");
                for (var r = RACK_COUNT; r >= 1; --r)
                    makeRack(rowEl, r + side);
            }
        } //end makeRacks()

        //=====================================================================================
        //makeRack ~~
        //	builds a rack (e.g. "3E") with the widgets of its pvs and,
        //	if it has DTCs, the small chart of their temperatures
        function makeRack(parentEl, rack) {
            var rackEl = _rackEls[rack] = addEl(parentEl, "div", "rack");
            addEl(rackEl, "div", "rackName", rack);

            //rack protection state and rack temperatures
            var topEl = addEl(rackEl, "div", "rackTop");
            makeWidget(topEl, "led", "Mu2e:RackProt:" + rack + ":state");
            for (var t = 0; t < RACK_TEMPERATURE_COUNT; ++t)
                makeWidget(topEl, "temper", "Mu2e:RackTemp:" + rack + ":" + t + ":temperature");

            //first shelf: the phases of left and right PDU
            var pduEl = addEl(rackEl, "div", "shelf");
            var pduSides = ["L", "R"];
            for (var p = 0; p < pduSides.length; ++p) {
                addEl(pduEl, "span", "pduName", "PDU " + pduSides[p]);
                var hasPdu = pduSides[p] != "L" || RACKS_WITHOUT_LEFT_PDU.indexOf(rack) == -1;
                for (var phase = 1; phase <= PDU_PHASE_COUNT; ++phase)
                    if (hasPdu)
                        makeWidget(pduEl, "led small", "Mu2e:PDU:" + rack + "_" + pduSides[p] + ":P" + phase);
                    else
                        addEl(pduEl, "span", "led small none");
            }

            //the other shelves, from the top one: DTC temperatures and name of the node, if any
            var nodes = RACK_NODES[rack] || [];
            for (var shelf = SHELF_COUNT - 1; shelf >= 1; --shelf) {
                var shelfEl = addEl(rackEl, "div", "shelf");
                var node = nodes[shelf - 1];
                if (!node) continue;

                for (var d = 0; d < DTC_SLOT_COUNT; ++d)
                    if (d < dtcCount(node))
                        makeWidget(shelfEl, "temper", "Mu2e:CompStatus:" + node + ":DTC" + d + ":dtctemp");
                    else
                        addEl(shelfEl, "span", "temper none");
                addEl(shelfEl, "span", "nodeName", node);
            }

            if (nodes.length)
                makeRackChart(rackEl, rack);
        } //end makeRack()

        //=====================================================================================
        //dtcCount ~~
        //	returns the number of DTCs of the node, from the kind in its name (e.g. "trk" of "trk-01")
        function dtcCount(node) {
            return DTC_COUNT_BY_KIND[node.split("-")[0]] || 0;
        } //end dtcCount()

        //=====================================================================================
        //makeWidget ~~
        //	adds to parentEl the button that shows the pv, kind is "led" or "temper".
        //	A click opens the plot of the pv.
        function makeWidget(parentEl, kind, pvName) {
            var el = addEl(parentEl, "button");
            el.onclick = drawGraph.bind(null, pvName);
            _widgets[pvName] = { el: el, kind: kind };
            updateWidget(pvName);
        } //end makeWidget()

        //=====================================================================================
        //updateWidget ~~
        //	shows value, severity and tooltip of the pv
        function updateWidget(pvName) {
            var widget = _widgets[pvName];
            var settings = _pvSettings[pvName];

            var state = "unknown";
            if (widget.time !== undefined) {
                var stale = !(Date.now() / 1000 - widget.time < STALE_SECONDS);
                state = stale ? "stale" : (SEVERITY_CLASS[widget.severity] || "unknown");
            }
            widget.el.className = "pv " + widget.kind + " " + state;

            if (widget.kind == "temper") {
                var value = Number.parseFloat(widget.value);
                widget.el.textContent = isNaN(value) ? "-" : value.toFixed(1);
            }

            var toolTip = pvName;
            if (widget.time === undefined)
                toolTip += "\nNo value received yet";
            else
                toolTip += "\nValue: " + widget.value + (settings && settings.Units ? " " + settings.Units : "") +
                    "\nTime: " + new Date(widget.time * 1000).toLocaleString("en-GB") + (state == "stale" ? " (stale)" : "") +
                    "\nStatus: " + widget.status +
                    "\nSeverity: " + widget.severity;
            if (settings)
                toolTip += "\nWarning limits: " + Number.parseFloat(settings.Lower_Warning_Limit) + " to " + Number.parseFloat(settings.Upper_Warning_Limit) +
                    "\nAlarm limits: " + Number.parseFloat(settings.Lower_Alarm_Limit) + " to " + Number.parseFloat(settings.Upper_Alarm_Limit);
            widget.el.title = toolTip;
        } //end updateWidget()

        //=====================================================================================
        //drawGraph ~~
        //	opens the plot of the pv in a new window
        function drawGraph(pvName) {
            var url = location.origin + "/WebPath/UserWebPath/html/DCSMonitoringPages/Plot.html?urn=" +
                DesktopContent._localUrnLid + "&pv_names=" + encodeURIComponent(pvName);
            DesktopContent.openNewWindow("Plot", pvName, url, false);
        } //end drawGraph()

        //=====================================================================================
        //getPvSettings ~~
        //	requests units and limits of all the pvs, they are only used in the tooltips
        function getPvSettings() {
            DesktopContent.XMLHttpRequest("Request?RequestType=getPVSettings",
                "pvList=" + Object.keys(_widgets).join(",") + "," + //the server expects a comma after each pv
                "&id=0",
                pvSettingsHandler /*returnHandler*/,
                0 /*reqParam*/,
                0 /*progressHandler*/,
                0 /*callHandlerOnErr*/,
                true /*doNotShowLoadingOverlay*/);
        } //end getPvSettings()

        //=====================================================================================
        function pvSettingsHandler(req) {
            try {
                _pvSettings = JSON.parse(DesktopContent.getXMLValue(req, "JSON"));
            }
            catch (e) {
                Debug.log("Illegal pv settings from server: " + e);
                return;
            }
            for (var pvName in _widgets)
                updateWidget(pvName);
        } //end pvSettingsHandler()

        //=====================================================================================
        //generateUID ~~
        //	registers the list of pvs at the server, the returned uid is then used to poll
        function generateUID() {
            _uid = "";
            window.clearTimeout(_pollTimer);

            DesktopContent.XMLHttpRequest("Request?RequestType=generateUID",
                "pvList=" + Object.keys(_widgets).join(",") + ",",
                generateUIDHandler /*returnHandler*/,
                0 /*reqParam*/,
                0 /*progressHandler*/,
                true /*callHandlerOnErr*/,
                true /*doNotShowLoadingOverlay*/);
        } //end generateUID()

        //=====================================================================================
        function generateUIDHandler(req, reqParam, errStr) {
            if (!errStr) {
                try {
                    var uid = JSON.parse(DesktopContent.getXMLValue(req, "JSON")).message;
                    if (uid == "-1") errStr = "Unable to generate UID";
                    else _uid = uid;
                }
                catch (e) {
                    errStr = "Illegal response from server: " + e;
                }
            }

            if (errStr) { //try again later
                showStatus(errStr);
                _pollTimer = window.setTimeout(generateUID, POLL_PERIOD_MS);
                return;
            }
            pollServer();
        } //end generateUIDHandler()

        //=====================================================================================
        function pollServer() {
            DesktopContent.XMLHttpRequest("Request?RequestType=poll&uid=" + _uid,
                "",
                pollServerHandler /*returnHandler*/,
                0 /*reqParam*/,
                0 /*progressHandler*/,
                true /*callHandlerOnErr*/,
                true /*doNotShowLoadingOverlay*/);
        } //end pollServer()

        //=====================================================================================
        //pollServerHandler ~~
        //	the server returns only the pvs that changed since the last poll
        function pollServerHandler(req, reqParam, errStr) {
            var response;
            if (!errStr) {
                try {
                    var jsonStr = DesktopContent.getXMLValue(req, "JSON") || "";
                    response = JSON.parse(jsonStr.replace(/\s/g, "")); //the values may hold whitespace that is illegal in JSON
                }
                catch (e) {
                    errStr = "Illegal response from server: " + e;
                }
            }

            if (!errStr && response.message == "NOT_FOUND") { //e.g. the server was restarted
                Debug.log("Have to generate new UID!");
                generateUID();
                return;
            }

            if (!errStr) {
                for (var pvName in response) {
                    var widget = _widgets[pvName];
                    if (!widget) continue;
                    widget.value = response[pvName].Value;
                    widget.time = response[pvName].Timestamp;
                    widget.status = response[pvName].Status;
                    widget.severity = response[pvName].Severity;
                }
                _lastPollTime = Date.now();
            }

            //update also the pvs that did not change, since they may have become stale
            for (var pvName in _widgets)
                updateWidget(pvName);
            showStatus(errStr);

            _pollTimer = window.setTimeout(pollServer, POLL_PERIOD_MS);
        } //end pollServerHandler()

        //=====================================================================================
        //showStatus ~~
        //	shows in the header the time of the last poll and the count of pvs in alarm, or the problem
        function showStatus(problem) {
            var statusEl = document.getElementById("status");
            statusEl.classList.toggle("problem", !!problem);
            if (problem) {
                statusEl.textContent = problem;
                return;
            }

            var majorCount = 0, minorCount = 0;
            for (var pvName in _widgets) {
                if (_widgets[pvName].el.classList.contains("major")) ++majorCount;
                if (_widgets[pvName].el.classList.contains("minor")) ++minorCount;
            }
            statusEl.textContent = majorCount + " alarm, " + minorCount + " warning  -  updated " +
                new Date(_lastPollTime).toLocaleTimeString("en-GB");
        } //end showStatus()

        /////////////////////////////////////////////////////////////////////////////////////////
        //DTC temperature trends

        //=====================================================================================
        //makeRangeButtons ~~
        //	one button for each time range of the trend charts
        function makeRangeButtons() {
            var buttonsEl = document.getElementById("rangeButtons");
            for (var i = 0; i < RANGE_PRESETS.length; ++i) {
                var buttonEl = addEl(buttonsEl, "button", "", RANGE_PRESETS[i][0]);
                buttonEl.rangeSeconds = RANGE_PRESETS[i][1];
                buttonEl.onclick = setTrendRange.bind(null, RANGE_PRESETS[i][1]);
            }
        } //end makeRangeButtons()

        //=====================================================================================
        //addTrendSeries ~~
        //	adds to the chart the lines of the DTC temperatures of the node: solid for DTC0, dashed for DTC1
        function addTrendSeries(chart, rack, node, color, group) {
            for (var d = 0; d < dtcCount(node); ++d) {
                var pv = "Mu2e:CompStatus:" + node + ":DTC" + d + ":dtctemp";
                var series = { chart: chart, name: node + " DTC" + d, rack: rack, color: color, dashed: d > 0, group: group, points: [] };
                chart.series.push(series);
                (_trendSeries[pv] = _trendSeries[pv] || []).push(series);
            }
        } //end addTrendSeries()

        //=====================================================================================
        //makeRackChart ~~
        //	adds to the rack the small chart of its DTC temperatures, one color for each node
        function makeRackChart(rackEl, rack) {
            var chart = DCSChart.create(rackEl, { compact: true, highlightNearest: true, onDraw: trendChartDrawn });
            chart.noteEl = addEl(rackEl, "div", "rackChartNote");
            chart.idleNote = "DTC temperatures";

            var nodes = RACK_NODES[rack];
            for (var n = 0; n < nodes.length; ++n)
                addTrendSeries(chart, rack, nodes[n], DCSChart.COLORS[n % DCSChart.COLORS.length], nodes[n]);
            _trendCharts.push(chart);
        } //end makeRackChart()

        //=====================================================================================
        //makeSideChart ~~
        //	builds the chart of all the DTC temperatures of a side of the room, one color for each rack.
        //	The racks in the legend highlight their lines.
        function makeSideChart(parentEl, side, title) {
            var cardEl = addEl(parentEl, "div", "chartCard");
            var headEl = addEl(cardEl, "div", "chartHead");
            addEl(headEl, "span", "chartTitle", title);
            var legendEl = addEl(headEl, "span", "chartLegend");
            var noteEl = addEl(headEl, "span", "chartNote");

            var chart = DCSChart.create(cardEl, { highlightNearest: true, onDraw: trendChartDrawn, onZoom: zoomTrends });
            chart.noteEl = noteEl;
            chart.idleNote = "";

            var colorIndex = 0;
            for (var r = 1; r <= RACK_COUNT; ++r) {
                var rack = r + side;
                var nodes = RACK_NODES[rack];
                if (!nodes) continue;

                var color = DCSChart.COLORS[colorIndex++ % DCSChart.COLORS.length];
                for (var n = 0; n < nodes.length; ++n)
                    addTrendSeries(chart, rack, nodes[n], color, rack);

                var itemEl = addEl(legendEl, "span", "legendItem");
                addEl(itemEl, "span", "swatch").style.backgroundColor = color;
                addEl(itemEl, "span", "", rack);
                itemEl.onmouseenter = highlightRack.bind(null, rack);
                itemEl.onmouseleave = highlightRack.bind(null, null);
            }

            _sideCharts.push(chart);
            _trendCharts.push(chart);
        } //end makeSideChart()

        //=====================================================================================
        //highlightRack ~~
        //	highlights the rack and its lines in the charts of the sides, no rack if null
        function highlightRack(rack) {
            for (var name in _rackEls)
                _rackEls[name].classList.toggle("highlight", name == rack);
            for (var c = 0; c < _sideCharts.length; ++c) {
                _sideCharts[c].highlightGroup = rack;
                DCSChart.draw(_sideCharts[c]);
            }
        } //end highlightRack()

        //=====================================================================================
        //trendChartDrawn ~~
        //	called after a chart was drawn: the note of the chart shows the line closest to the mouse
        function trendChartDrawn(chart, readout) {
            var note = chart.idleNote;
            if (readout.nearest) {
                var compact = chart.options.compact;
                note = (compact ? "" : readout.nearest.rack + " ") + readout.nearest.name + ": " +
                    DCSChart.valueText(readout.values[chart.series.indexOf(readout.nearest)]) +
                    (compact ? "" : " " + _trend.units + " at " + DCSChart.timeText(readout.time));
            }
            else if (!readout.hasData && !_trend.loading)
                note = "no archived values";
            chart.noteEl.textContent = note;
        } //end trendChartDrawn()

        //=====================================================================================
        //setTrendRange ~~
        //	the charts show the last seconds until now, and are refreshed periodically
        function setTrendRange(seconds) {
            _trend.seconds = seconds;
            var buttonEls = document.getElementById("rangeButtons").children;
            for (var i = 0; i < buttonEls.length; ++i)
                buttonEls[i].classList.toggle("active", buttonEls[i].rangeSeconds == seconds);
            fetchTrends();
        } //end setTrendRange()

        //=====================================================================================
        //zoomTrends ~~
        //	called when a time range (ms) was selected with the mouse in a chart:
        //	all the charts show it, until a range button is clicked
        function zoomTrends(fromTime, toTime) {
            _trend.viewFrom = fromTime;
            _trend.viewTo = toTime;
            setTrendRange(0);
        } //end zoomTrends()

        //=====================================================================================
        //fetchTrends ~~
        //	starts to read from the archiver the history of all the DTC temperatures
        function fetchTrends() {
            window.clearTimeout(_trend.timer);
            if (_trend.batch) _trend.batch.cancelled = true; //ignore the replies to the previous requests

            if (_trend.seconds) {
                _trend.viewTo = Date.now();
                _trend.viewFrom = _trend.viewTo - _trend.seconds * 1000;
            }
            for (var c = 0; c < _trendCharts.length; ++c) {
                _trendCharts[c].viewFrom = _trend.viewFrom;
                _trendCharts[c].viewTo = _trend.viewTo;
            }

            _trend.loading = true;
            _trend.problem = "";
            _trend.batch = DCSChart.fetchHistory(Object.keys(_trendSeries), _trend.viewFrom / 1000, _trend.viewTo / 1000,
                trendSeriesHandler, trendDoneHandler);
            drawTrendCharts();
        } //end fetchTrends()

        //=====================================================================================
        //trendSeriesHandler ~~
        //	called with the history of each pv
        function trendSeriesHandler(pv, reply, errStr) {
            if (errStr) {
                _trend.problem = "History request failed: " + errStr;
                return;
            }
            if (reply.archiveProblem) _trend.problem = "Archiver history: " + reply.archiveProblem;
            if (reply.units) _trend.units = reply.units;

            DCSChart.keepRange(reply.points, TREND_VALID_RANGE[0], TREND_VALID_RANGE[1]);
            var seriesList = _trendSeries[pv];
            for (var i = 0; i < seriesList.length; ++i) {
                seriesList[i].points = reply.points;
                if (typeof reply.highLimit == "number") seriesList[i].chart.highLimit = reply.highLimit;
                DCSChart.draw(seriesList[i].chart);
            }
        } //end trendSeriesHandler()

        //=====================================================================================
        //trendDoneHandler ~~
        //	called when the history of all the pvs was read
        function trendDoneHandler() {
            _trend.loading = false;
            drawTrendCharts();

            if (_trend.seconds) //a long time range changes slowly
                _trend.timer = window.setTimeout(fetchTrends, Math.max(TREND_REFRESH_MS, _trend.seconds * 1000 / 200));
        } //end trendDoneHandler()

        //=====================================================================================
        function drawTrendCharts() {
            var noteEl = document.getElementById("trendNote");
            noteEl.classList.toggle("problem", !!_trend.problem);
            noteEl.textContent = _trend.problem || (_trend.loading ? "loading..." : "");

            for (var c = 0; c < _trendCharts.length; ++c)
                DCSChart.draw(_trendCharts[c]);
        } //end drawTrendCharts()

    </script>
</head>

<body onload='//init() called by DesktopContent.js'>

    <div id="header">
        <span id="title">DAQ room health</span>
        <span id="status"></span>
        <div id="legend">
            <span class="swatch ok"></span>No alarm
            <span class="swatch minor"></span>Warning
            <span class="swatch major"></span>Alarm
            <span class="swatch invalid"></span>Invalid
            <span class="swatch stale"></span>Stale
            <span class="swatch unknown"></span>Undefined state

    </div>

        <span class="hint">from the archiver, local time - solid line DTC0, dashed line DTC1 - drag in a chart to zoom</span>

    <div id="charts"></div>
