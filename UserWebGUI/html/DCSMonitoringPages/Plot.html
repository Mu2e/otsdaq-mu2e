<!DOCTYPE HTML>
<html lang="en">
<head>
    <title>Plot</title>

    <link href='/WebPath/css/fonts.css?family=Inconsolata:400' rel='stylesheet' type='text/css'>
    <link href='/WebPath/css/fonts.css?family=Comfortaa:400' rel='stylesheet' type='text/css'>
    <link rel="stylesheet" type="text/css" href="/WebPath/UserWebPath/css/DCSMonitoringPages/Plot.css">

    <script type="text/JavaScript" src="/WebPath/js/Globals.js"></script>
    <script type="text/JavaScript" src="/WebPath/js/Debug.js"></script>
    <script type="text/JavaScript" src="/WebPath/js/DesktopContent.js"></script>
    <script type="text/JavaScript" src="/WebPath/UserWebPath/js/DCSChart.js"></script>

    <script>

        //functions:
        //	init()
        //	getPvNames()
        //	makeRangeButtons()
        //	makeLegend()
        //	toggleSeries(series)
        //	setRange(seconds)
        //	zoom(fromTime, toTime)
        //	fetchHistory()
        //	seriesHandler(pv, reply, errStr)
        //	doneHandler()
        //	chartDrawn(chart, readout)
        //
        //====================== start high-level behavior description
        //
        //	Trend of one or more pvs, read from the archiver database (chart of DCSChart.js).
        //	The pvs are given by the url parameter pv_names (or pv_name), that is one of:
        //		- a pv name
        //		- a JSON string with a pv name
        //		- a JSON array of pv names, or of objects with the pv name as key (e.g. [{"my pv":0}])
        //
        //	The chart shows the last hours until now and is refreshed periodically,
        //	or the fixed time range selected by dragging the mouse in the chart.
        //
        //====================== end high-level behavior description
        //
        /////////////////////////////////////////////////////////////////////////////////////////
        /////////////////////////////////////////////////////////////////////////////////////////

        var RANGE_PRESETS = [["1 h", 3600], ["6 h", 21600], ["12 h", 43200], ["24 h", 86400], ["7 d", 604800], ["14 d", 1209600], ["30 d", 2592000]];
        var DEFAULT_SECONDS = 21600;
        var TEMPERATURE_VALID_RANGE = [-50, 200]; //degrees, for the pvs with "temp" in the name: a value out of this range is a bad reading and is not plotted
        var REFRESH_MS = 15000; 	//at least, a long time range is refreshed less often

        var _chart;
        var _seriesOfPv = {}; 		//pv name => series of the chart, that also has valueEl and itemEl of the legend
        var _view = {
            seconds: DEFAULT_SECONDS, 	//the chart shows the last seconds, or 0 if it shows the fixed time range
            batch: null, timer: 0, loading: false, problem: "", units: ""
        };


        //=====================================================================================
        //init called once body has loaded
        function init() {
            Debug.log("init() was called");

            var pvNames = getPvNames();
            document.getElementById("title").textContent = pvNames.length == 1 ? pvNames[0] : pvNames.length + " pvs";
            document.title = pvNames.length == 1 ? pvNames[0] : "Plot";

            _chart = DCSChart.create(document.getElementById("plot"), {
                band: pvNames.length == 1, 		//with more lines the ranges would overlap
                highlightNearest: pvNames.length > 1,
                onDraw: chartDrawn, onZoom: zoom
            });
            for (var i = 0; i < pvNames.length; ++i) {
                if (_seriesOfPv[pvNames[i]]) continue; //twice the same pv
                var series = { name: pvNames[i], color: DCSChart.COLORS[i % DCSChart.COLORS.length],
                    dashed: i >= DCSChart.COLORS.length, points: [] };
                _chart.series.push(series);
                _seriesOfPv[pvNames[i]] = series;
            }

            makeRangeButtons();
            makeLegend();
            window.addEventListener("resize", function () { DCSChart.draw(_chart); });

            if (!pvNames.length) {
                _view.problem = "No pv to plot: the url parameter pv_names is missing";
                DCSChart.draw(_chart);
                return;
            }
            setRange(_view.seconds);
        } //end init()

        //=====================================================================================
        //getPvNames ~~
        //	returns the array of the pv names given by the url parameters
        function getPvNames() {
            var parameter = DesktopContent.getParameter(0, "pv_names") || DesktopContent.getParameter(0, "pv_name");
            if (!parameter) return [];

            var names = parameter; //a pv name, if it is not JSON
            try {
                names = JSON.parse(parameter);
            }
            catch (e) { }

            if (!Array.isArray(names)) names = [names];
            return names.map(function (name) {
                return String(name !== null && typeof name == "object" ? Object.keys(name)[0] : name);
            });
        } //end getPvNames()

        //=====================================================================================
        //makeRangeButtons ~~
        //	one button for each time range
        function makeRangeButtons() {
            var buttonsEl = document.getElementById("rangeButtons");
            RANGE_PRESETS.forEach(function (preset) {
                var buttonEl = buttonsEl.appendChild(document.createElement("button"));
                buttonEl.textContent = preset[0];
                buttonEl.rangeSeconds = preset[1];
                buttonEl.onclick = setRange.bind(null, preset[1]);
            });
        } //end makeRangeButtons()

        //=====================================================================================
        //makeLegend ~~
        //	one entry for each pv, with its value: a click hides or shows the line
        function makeLegend() {
            var legendEl = document.getElementById("legend");
            _chart.series.forEach(function (series) {
                var itemEl = series.itemEl = legendEl.appendChild(document.createElement("button"));
                itemEl.className = "legendItem";
                itemEl.title = "Click to hide or show";
                itemEl.onclick = toggleSeries.bind(null, series);

                var swatchEl = itemEl.appendChild(document.createElement("span"));
                swatchEl.className = "swatch";
                swatchEl.style.backgroundColor = series.color;
                itemEl.appendChild(document.createElement("span")).textContent = series.name;
                series.valueEl = itemEl.appendChild(document.createElement("span"));
                series.valueEl.className = "legendValue";
            });
        } //end makeLegend()

        //=====================================================================================
        function toggleSeries(series) {
            series.hidden = !series.hidden;
            series.itemEl.classList.toggle("hidden", series.hidden);
            DCSChart.draw(_chart);
        } //end toggleSeries()

        //=====================================================================================
        //setRange ~~
        //	the chart shows the last seconds until now, and is refreshed periodically
        function setRange(seconds) {
            _view.seconds = seconds;
            var buttonEls = document.getElementById("rangeButtons").children;
            for (var i = 0; i < buttonEls.length; ++i)
                buttonEls[i].classList.toggle("active", buttonEls[i].rangeSeconds == seconds);
            fetchHistory();
        } //end setRange()

        //=====================================================================================
        //zoom ~~
        //	called when a time range (ms) was selected with the mouse in the chart:
        //	the chart shows it, until a range button is clicked
        function zoom(fromTime, toTime) {
            _chart.viewFrom = fromTime;
            _chart.viewTo = toTime;
            setRange(0);
        } //end zoom()

        //=====================================================================================
        //fetchHistory ~~
        //	starts to read from the archiver the history of the pvs
        function fetchHistory() {
            window.clearTimeout(_view.timer);
            if (_view.batch) _view.batch.cancelled = true; //ignore the replies to the previous requests

            if (_view.seconds) {
                _chart.viewTo = Date.now();
                _chart.viewFrom = _chart.viewTo - _view.seconds * 1000;
            }

            _view.loading = true;
            _view.problem = "";
            _view.batch = DCSChart.fetchHistory(Object.keys(_seriesOfPv), _chart.viewFrom / 1000, _chart.viewTo / 1000,
                seriesHandler, doneHandler);
            DCSChart.draw(_chart);
        } //end fetchHistory()

        //=====================================================================================
        //seriesHandler ~~
        //	called with the history of each pv
        function seriesHandler(pv, reply, errStr) {
            if (errStr) {
                _view.problem = "History request failed: " + errStr;
                return;
            }
            if (reply.archiveProblem) _view.problem = "Archiver history of " + pv + ": " + reply.archiveProblem;

            if (/temp/i.test(pv))
                DCSChart.keepRange(reply.points, TEMPERATURE_VALID_RANGE[0], TEMPERATURE_VALID_RANGE[1]);
            _seriesOfPv[pv].points = reply.points;
            _seriesOfPv[pv].units = reply.units || "";
            if (_chart.series.length == 1) { //the limits are shown only for one pv
                _chart.lowLimit = typeof reply.lowLimit == "number" ? reply.lowLimit : NaN;
                _chart.highLimit = typeof reply.highLimit == "number" ? reply.highLimit : NaN;
            }
            DCSChart.draw(_chart);
        } //end seriesHandler()

        //=====================================================================================
        //doneHandler ~~
        //	called when the history of all the pvs was read
        function doneHandler() {
            _view.loading = false;
            DCSChart.draw(_chart);

            if (_view.seconds) //a long time range changes slowly
                _view.timer = window.setTimeout(fetchHistory, Math.max(REFRESH_MS, _view.seconds * 1000 / 400));
        } //end doneHandler()

        //=====================================================================================
        //chartDrawn ~~
        //	called after the chart was drawn: shows the values at the mouse position, or the latest ones
        function chartDrawn(chart, readout) {
            chart.series.forEach(function (series, s) {
                var value = readout.values[s];
                series.valueEl.textContent = DCSChart.valueText(value) + (value !== null && series.units ? " " + series.units : "");
                series.itemEl.classList.toggle("nearest", series == readout.nearest);
            });

            var noteEl = document.getElementById("note");
            noteEl.classList.toggle("problem", !!_view.problem);
            if (_view.problem)
                noteEl.textContent = _view.problem;
            else if (_view.loading && !readout.hasData)
                noteEl.textContent = "loading...";
            else if (!readout.hasData)
                noteEl.textContent = "no archived values in this time range";
            else
                noteEl.textContent = (readout.pointerInPlot ? "values at " : "latest values, ") + DCSChart.timeText(readout.time) +
                    (_view.seconds ? "" : "  -  fixed time range, click a period to follow again");
        } //end chartDrawn()

    </script>
</head>

<body onload='//init() called by DesktopContent.js'>

    <div id="header">
        <span id="title"></span>
        <span id="rangeButtons"></span>
        <span class="hint">from the archiver, local time - drag in the chart to zoom</span>
        <div id="note"></div>
    </div>

    <div id="plot"></div>
    <div id="legend"></div>

</body>
</html>
