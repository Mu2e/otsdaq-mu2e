<!DOCTYPE HTML>
<html lang="en">
<head>
	<title>Mu2e Run Control</title>

	<link href='/WebPath/css/fonts.css?family=Inconsolata:400' rel='stylesheet' type='text/css'>
	<link rel="stylesheet" type="text/css" href="/WebPath/UserWebPath/css/Mu2e.css">
	<link rel="stylesheet" type="text/css" href="/WebPath/UserWebPath/css/Mu2eRunControl.css">

	<script type="text/JavaScript" src="/WebPath/js/Globals.js"></script>
	<script type="text/JavaScript" src="/WebPath/js/Debug.js"></script>
	<script type="text/JavaScript" src="/WebPath/js/DesktopContent.js"></script>
	<script type="text/JavaScript" src="/WebPath/js/js_lib/ConfigurationAPI.js"></script>
	<script type="text/JavaScript" src="/WebPath/UserWebPath/js/Mu2e.js"></script>
	<script type="text/JavaScript" src="/WebPath/UserWebPath/js/Mu2eHardware.js"></script>

	<script>

		var _fsmName = "";
		var _fsmNames = [];
		var _subsystems = [];
		var _system = {};
		var _systemAliases = [];
		var _iterator = {};        // active_plan, activePlanStatus, error from Iterator
		var _pollTimer = 0;
		var _pollNonce = 0;
		var _pollFailures = 0;
		var _firstStatus = true;   // true until the initial getRemoteSubsystems parse is done
		var _reloading = false;    // true while loadSubsystems() is re-fetching after a record change

		// Errors older than this (seconds) are not popped as red errors, only
		// shown once as an informational warning on first load (mirrors SubsystemLaunch).
		var _ERROR_AGE_LIMIT = 60;
		var _ITERATOR_ERROR_AGE_LIMIT = 5 * 60;
		// After a user-requested reboot, do not warn about UNKNOWN status for this long.
		var _REBOOT_GRACE_SEC = 60;

		// Valid transitions per state
		var _TRANSITIONS = {
			"Initial":    ["Configure"],
			"Halted":     ["Configure", "Start"],
			"Configured": ["Start", "Halt"],
			"Running":    ["Stop", "Halt"],
			"Paused":     ["Stop", "Halt"],
			"Failed":     ["Halt"],
			"Error":      ["Halt"],
		};

		// =============================================================
		// init
		// =============================================================
		function init() {
			Debug.log("Mu2eRunControl init()");
			DesktopContent.tooltip("Mu2e Run Control",
				"Mu2e subsystem dashboard — status, transitions, and run control.");
			DesktopContent.setWindowTooltip("Mu2e subsystem dashboard.");

			// First get the active FSM name, then get all FSM names
			DesktopContent.XMLHttpRequest(
				"Request?RequestType=getCurrentState", "",
				function (reqState) {
					var activeFsm = DesktopContent.getXMLValue(reqState, "active_fsmName");

					DesktopContent.XMLHttpRequest(
						"Request?RequestType=getStateMachineNames", "",
						function (req) {
							var names = req.responseXML.getElementsByTagName("stateMachineName");
							_fsmNames = [];
							for (var i = 0; i < names.length; ++i)
								_fsmNames.push(names[i].getAttribute("value"));

							// Default to the active FSM, or first available
							if (activeFsm && _fsmNames.indexOf(activeFsm) >= 0)
								_fsmName = activeFsm;
							else if (_fsmNames.length)
								_fsmName = _fsmNames[0];
							loadSubsystems();
						},
						0, 0, true, false, true);
				},
				0, 0, true, false, true);
		}

		// =============================================================
		// loadSubsystems
		// =============================================================
		function loadSubsystems() {
			if (_pollTimer) clearTimeout(_pollTimer);
			++_pollNonce; // invalidate any in-flight status poll
			_reloading = true;
			DesktopContent.XMLHttpRequest(
				"Request?RequestType=getRemoteSubsystems&fsmName=" + _fsmName, "",
				function (req, reqParam, errStr) {
					_reloading = false;
					if (errStr || !req || !req.responseXML) {
						Debug.err("Failed to load subsystem records: " +
							(errStr || "empty response") +
							"\n\nRetrying in 5 seconds...");
						_pollTimer = setTimeout(loadSubsystems, 5000);
						return;
					}
					parseSubsystems(req);
					parseSystemStatus(req);
					parseIteratorStatus(req);
					parseAliases(req);
					_firstStatus = false;
					renderAll();
					startPolling();
				},
				0, 0, true, false, true);
		}

		// =============================================================
		// Parsing
		// =============================================================
		var _SS_FIELDS = ["name","url","id","status","progress","detail",
			"lastStatusTime","lastStatusChangeTime","configAlias","configAliasChoices",
			"fsmMode","fsmIncluded","fsmName","landingPage",
			"consoleErrCount","consoleWarnCount",
			"activeContextGroupName","activeContextGroupKey",
			"activeConfigGroupName","activeConfigGroupKey",
			"selectedConfigGroupName","selectedConfigGroupKey"];

		function parseSubsystems(req) {
			_subsystems = [];
			var arrs = {};
			for (var i = 0; i < _SS_FIELDS.length; ++i)
				arrs[_SS_FIELDS[i]] = req.responseXML.getElementsByTagName(
					"subsystem_" + _SS_FIELDS[i]);
			var count = arrs[_SS_FIELDS[0]].length;
			for (var j = 0; j < count; ++j) {
				var ss = {};
				for (var i = 0; i < _SS_FIELDS.length; ++i)
					ss[_SS_FIELDS[i]] = arrs[_SS_FIELDS[i]][j] ?
						arrs[_SS_FIELDS[i]][j].getAttribute("value") : "";
				ss.fsmIncluded = ss.fsmIncluded | 0;
				ss.progress = ss.progress | 0;
				var parsed = Mu2e.stripStatusError(ss.status);
				ss.status = parsed.status;
				ss.error = parsed.error;
				ss.lastStatusChangeTime = arrs.lastStatusChangeTime && arrs.lastStatusChangeTime[j] ?
					arrs.lastStatusChangeTime[j].getAttribute("value") : "";

				// Pre-existing subsystem error on first load: show once as a
				// warning with its age, not as a fresh red error. Excluded
				// subsystems are not popped at all (the row still shows it).
				if (ss.fsmIncluded && Mu2e.isErrorStatus(ss.status)) {
					var rawErr = ss.status + (ss.error ? ":::" + ss.error : "");
					var ago = Mu2e.errorSecondsAgo(Mu2e.decodeDetail(ss.error));
					if (ago === -1) ago = Mu2e.timestampSecondsAgo(ss.lastStatusChangeTime);
					if (ago > _ERROR_AGE_LIMIT)
						Debug.warn("Here is the last error from Subsystem '" + ss.name +
							"' " + Mu2e.formatAgo(ago) + " for reference:\n\n" +
							Mu2e.decodeDetail(rawErr));
					else
						Debug.err("From Subsystem '" + ss.name + "'... " +
							Mu2e.decodeDetail(rawErr));
				}
				// Default FSM mode to "Do Not Halt"
				if (ss.fsmMode !== "Do Not Halt") {
					ss.fsmMode = "Do Not Halt";
					DesktopContent.XMLHttpRequest(
						"Request?RequestType=setRemoteSubsystemFsmControl" +
						"&targetSubsystem=" + encodeURIComponent(ss.name) +
						"&controlType=mode&setValue=" +
						encodeURIComponent("Do Not Halt"), "",
						null, 0, 0, true, true, true);
				}

				_subsystems.push(ss);
			}
		}

		var _lastError = "";

		// system_error is the Gateway's concatenation of per-subsystem errors
		// ("Error at <ts>:\n..." joined by "\n"), each naming its subsystem as
		// 'Name' or 'Name.'. Drop the entries that belong to EXCLUDED subsystems.
		// (Newer Gateways already skip excluded subsystems server-side; this
		// keeps the page quiet against older ones too.)
		function filterSystemError(err) {
			if (!err) return "";
			var excluded = [];
			for (var i = 0; i < _subsystems.length; ++i)
				if (!_subsystems[i].fsmIncluded) excluded.push("'" + _subsystems[i].name);
			if (!excluded.length) return err;
			var parts = err.split(/\n(?=Error at )/);
			var kept = [];
			for (var p = 0; p < parts.length; ++p) {
				var drop = false;
				for (var e = 0; e < excluded.length && !drop; ++e)
					if (parts[p].indexOf(excluded[e]) >= 0) drop = true;
				if (!drop) kept.push(parts[p]);
			}
			return kept.join("\n");
		}

		function parseSystemStatus(req) {
			var rawState = DesktopContent.getXMLValue(req, "current_state") || "unknown";
			var parsedState = Mu2e.stripStatusError(rawState);
			_system.state = parsedState.status;

			_system.inTransition = DesktopContent.getXMLValue(req, "in_transition") === "1";
			_system.transition = DesktopContent.getXMLValue(req, "current_transition") || "";
			_system.progress = DesktopContent.getXMLValue(req, "transition_progress") | 0;
			_system.timeInState = DesktopContent.getXMLValue(req, "time_in_state") | 0;
			var rn = DesktopContent.getXMLValue(req, "run_number");
			if (rn) _system.runNumber = rn;
			_system.selectedAlias = DesktopContent.getXMLValue(req, "UserLastConfigAlias") || "";
			var activeFsm = DesktopContent.getXMLValue(req, "active_fsmName");
			if (activeFsm) _system.activeFsm = activeFsm;
			var activeFsmWindow = DesktopContent.getXMLValue(req, "active_fsmWindowName");
			if (activeFsmWindow !== undefined) _system.activeFsmWindow = activeFsmWindow;
			var logEntry = DesktopContent.getXMLValue(req, "last_run_log_entry");
			if (logEntry) _system.lastRunLogEntry = Mu2e.decodeDetail(logEntry);

			// Errors: FSM error (current_error) plus accumulated remote-gateway
			// errors (system_error), merged the same way SubsystemLaunch does.
			var err = filterSystemError(DesktopContent.getXMLValue(req, "system_error") || "");
			var fsmErr = DesktopContent.getXMLValue(req, "current_error") || "";
			if (fsmErr) err = err ? (err + "\n\n" + fsmErr) : fsmErr;

			if (err && err !== _lastError) {
				_lastError = err;
				var ago = Mu2e.errorSecondsAgo(err);
				if (_firstStatus) {
					// Page just opened: this error pre-dates us, show for reference only.
					Debug.warn("Here is the <b>last error</b> that occurred " +
						Mu2e.formatAgo(ago) + " for reference:\n\n" + err);
				} else if (ago === -1 || ago < _ERROR_AGE_LIMIT) {
					Debug.err(err);
				}
			}
			_system.error = err;
		}

		// Iterator status (active_plan / active_plan_status / error_message)
		// rides along in every status response. Needed to decide how to Stop
		// (iterateHalt vs plain Stop) and to surface Iterator thread errors.
		function parseIteratorStatus(req) {
			_iterator.activePlan = DesktopContent.getXMLValue(req, "active_plan") || "";
			_iterator.activePlanStatus = DesktopContent.getXMLValue(req, "active_plan_status") || "";

			var err = DesktopContent.getXMLValue(req, "error_message") || "";
			if (err && err !== _iterator.error) {
				var ago = Mu2e.errorSecondsAgo(err);
				if (_firstStatus) {
					Debug.warn("Here is the <b>last Iterator error</b> that occurred " +
						Mu2e.formatAgo(ago) + " for reference:\n\n" + err);
				} else if (ago === -1 || ago < _ITERATOR_ERROR_AGE_LIMIT) {
					Debug.err("Iterator error: " + err);
				}
			}
			_iterator.error = err;
		}

		// True when the Iterator owns the FSM (a generated or table plan is active).
		function iteratorHasControl() {
			return _iterator.activePlan && _iterator.activePlan !== "" &&
				_iterator.activePlanStatus !== "Inactive";
		}

		function parseAliases(req) {
			_systemAliases = [];
			var names = req.responseXML.getElementsByTagName("config_alias");
			var keys = req.responseXML.getElementsByTagName("config_key");
			var comments = req.responseXML.getElementsByTagName("config_comment");
			for (var i = 0; i < names.length; ++i)
				_systemAliases.push({
					name: names[i].getAttribute("value"),
					key: keys[i] ? keys[i].getAttribute("value") : "",
					comment: comments[i] ? comments[i].getAttribute("value") : "",
				});
		}

		// Returns false if the subsystem records changed server-side (count or
		// names), in which case the caller must reload via loadSubsystems().
		function parseSubsystemStatus(req) {
			var fields = ["name","url","id","status","progress","detail",
				"lastStatusTime","lastStatusChangeTime","configAlias","configAliasChoices",
				"fsmMode","fsmIncluded","fsmName","consoleErrCount","consoleWarnCount",
				"activeContextGroupName","activeContextGroupKey",
				"activeConfigGroupName","activeConfigGroupKey",
				"selectedConfigGroupName","selectedConfigGroupKey"];
			var arrs = {};
			for (var i = 0; i < fields.length; ++i)
				arrs[fields[i]] = req.responseXML.getElementsByTagName("subsystem_" + fields[i]);
			var count = arrs[fields[0]].length;

			// Detect a change in the subsystem set (added/removed/renamed)
			var changed = (count !== _subsystems.length);
			for (var j = 0; !changed && j < count; ++j)
				if (arrs.name[j].getAttribute("value") !== _subsystems[j].name)
					changed = true;
			if (changed) {
				Debug.warn("A change in Subsystem records was identified, reloading Run Control info!");
				return false;
			}

			for (var j = 0; j < count; ++j) {
				var ss = _subsystems[j];
				var oldStatus = ss.status;
				var oldIncluded = ss.fsmIncluded ? 1 : 0;
				var oldAlias = ss.configAlias;
				var oldChoices = ss.configAliasChoices;

				for (var i = 0; i < fields.length; ++i)
					if (arrs[fields[i]][j])
						ss[fields[i]] = arrs[fields[i]][j].getAttribute("value");
				ss.fsmIncluded = ss.fsmIncluded | 0;
				ss.progress = ss.progress | 0;
				var p = Mu2e.stripStatusError(ss.status);
				ss.status = p.status;
				ss.error = p.error;

				var newStatus = ss.status;

				// Server-side change of the include set (e.g. from another page/user)
				if ((ss.fsmIncluded ? 1 : 0) !== oldIncluded && ss._pendingInclude === undefined)
					Debug.warn("There was a change identified at the server-side in the " +
						"included Subsystems. Subsystem '" + ss.name + "' is now " +
						(ss.fsmIncluded ? "INCLUDED" : "EXCLUDED") + "!");
				if (ss._pendingInclude !== undefined &&
						(ss.fsmIncluded ? 1 : 0) === (ss._pendingInclude ? 1 : 0))
					delete ss._pendingInclude;

				// Server-side change of the selected config alias
				if (ss.configAlias !== oldAlias && ss._pendingConfigAlias === undefined &&
						oldChoices) {
					Debug.warn("The selected configAlias for Subsystem '" + ss.name +
						"' has changed from '" + oldAlias + "' to '" + ss.configAlias + ".'");
					var aliasEl = document.getElementById("ss-alias-" + j);
					if (aliasEl) aliasEl.value = ss.configAlias;
				}
				if (ss._pendingConfigAlias !== undefined && ss.configAlias === ss._pendingConfigAlias)
					delete ss._pendingConfigAlias;

				// Alias choice list changed: needs a full re-render of that row
				if (ss.configAliasChoices !== oldChoices) {
					var row = document.getElementById("ss-row-" + j);
					if (row) row.outerHTML = renderSubsystemRow(j);
				}

				if (ss.fsmIncluded && newStatus === "UNKNOWN" && newStatus !== oldStatus) {
					var rebootAge = ss._rebootTime ? (Date.now() - ss._rebootTime) / 1000 : 999;
					if (rebootAge > _REBOOT_GRACE_SEC)
						Debug.warn("From Subsystem '" + ss.name + " (" + ss.url + ")... " +
							"Status is UNKNOWN. This may indicate that the Subsystem " +
							"is offline or unreachable, or if intermittent, too many " +
							"TRACE levels may be enabled.");
				}

				// New error on an INCLUDED subsystem only; excluded subsystems
				// keep the error visible in their row but never pop it up.
				if (ss.fsmIncluded && newStatus !== oldStatus &&
						Mu2e.isErrorStatus(newStatus) && !Mu2e.isErrorStatus(oldStatus)) {
					var rawErr = newStatus + (ss.error ? ":::" + ss.error : "");
					var ago = Mu2e.errorSecondsAgo(Mu2e.decodeDetail(ss.error));
					if (ago === -1) ago = Mu2e.timestampSecondsAgo(ss.lastStatusChangeTime);
					if (ago === -1 || ago < _ERROR_AGE_LIMIT)
						Debug.err("From Subsystem '" + ss.name + "'... " +
							Mu2e.decodeDetail(rawErr));
					else
						Debug.warn("Here is the last error from Subsystem '" + ss.name +
							"' " + Mu2e.formatAgo(ago) + " for reference:\n\n" +
							Mu2e.decodeDetail(rawErr));
				}
			}
			return true;
		}

		// Detail parsing, stateCell, formatTimeCell — now in Mu2e.js

		// =============================================================
		// Polling
		// =============================================================
		function startPolling() {
			if (_pollTimer) clearTimeout(_pollTimer);
			_pollTimer = setTimeout(pollStatus, 1000);
		}

		function pollStatus() {
			if (_pollTimer) clearTimeout(_pollTimer);
			_pollTimer = 0;
			if (_reloading) return; // loadSubsystems() will restart polling
			var nonce = ++_pollNonce;
			DesktopContent.XMLHttpRequest(
				"Request?RequestType=getRemoteSubsystemStatus" +
				"&fsmName=" + _fsmName +
				"&getRunNumber=" + (nonce % 5 === 0 ? "1" : "0"), "",
				function (req, reqParam, errStr) {
					if (nonce !== _pollNonce) return;

					// Never let a failed poll kill the loop: back off and retry.
					if (errStr || !req || !req.responseXML) {
						++_pollFailures;
						if (_pollFailures === 3)
							Debug.err("Status polling is failing: " +
								(errStr || "empty response") +
								"\n\nWill keep retrying in the background. " +
								"(Is the Gateway down or your session expired?)");
						_pollTimer = setTimeout(pollStatus, Math.min(5000, 1000 * _pollFailures));
						return;
					}
					if (_pollFailures >= 3) Debug.info("Status polling recovered.");
					_pollFailures = 0;

					if (!parseSubsystemStatus(req)) {
						loadSubsystems(); // records changed; full reload
						return;
					}
					parseSystemStatus(req);
					parseIteratorStatus(req);
					updateStatusBar();
					updateSubsystemRows();
					renderSystemOverview();
					refreshArtdaqGridIfChanged();
					_pollTimer = setTimeout(pollStatus, 1000);
				},
				0, 0, true, true, true);
		}

		// Resume polling promptly after a user action (like SubsystemLaunch's
		// window.onclick), so command feedback is not delayed a full poll cycle.
		function pollSoon(delayMs) {
			if (_pollTimer) clearTimeout(_pollTimer);
			_pollTimer = setTimeout(pollStatus, delayMs || 500);
		}

		// =============================================================
		// Rendering
		// =============================================================
		function renderAll() {
			updateStatusBar();
			renderConfigSection();
			renderSubsystemTable();
			loadSystemOverview();
			loadArtdaqGrid();
			updateClock();
			setInterval(updateClock, 1000);
		}

		function updateClock() {
			var el = document.getElementById("systemClock");
			if (el) el.textContent = new Date().toLocaleTimeString();
		}

		// =============================================================
		// Status bar
		// =============================================================
		function updateStatusBar() {
			var isRunning = _system.state === "Running" || _system.state === "Paused";

			var stateEl = document.getElementById("systemState");
			if (stateEl) {
				var stateText = _system.inTransition ?
					_system.transition + "..." : (_system.state || "---");
				var hasError = _system.error && _system.error !== "";

				// Merge run number into badge when running
				var runNum = "";
				if (isRunning) {
					var num = Mu2e.parseRunNumber(_system.runNumber);
					if (num !== "---") runNum = " #" + num;
				}

				if (hasError && !_system.inTransition) {
					stateEl.innerHTML = Mu2e.esc(stateText) +
						" <span class='error-icon' " +
						"title='" + Mu2e.escAttr(Mu2e.decodeDetail(_system.error).substring(0, 1000)) +
						"'>&#9888;</span>";
				} else {
					stateEl.textContent = stateText + runNum;
				}
				stateEl.className = "status-state " +
					(_system.inTransition ? "state-unknown" : Mu2e.stateClass(_system.state));
			}


			var cmtEl = document.getElementById("runComment");
			if (cmtEl) {
				if (isRunning && _system.lastRunLogEntry) {
					var comment = _system.lastRunLogEntry
						.replace(/^Run\s*#?\d+\s*:\s*/i, "");
					cmtEl.textContent = comment;
					cmtEl.style.display = "";
				} else {
					cmtEl.textContent = "";
					cmtEl.style.display = "none";
				}
			}

			var timeEl = document.getElementById("timeInState");
			if (timeEl) timeEl.textContent = Mu2e.formatTime(_system.timeInState);

			// Iterator Start/Stop button
			var mcRunBtn = document.getElementById("mc-run-btn");
			if (mcRunBtn) {
				var isRunning = _system.state === "Running" || _system.state === "Paused";
				var canStart = _system.state === "Halted" || _system.state === "Configured";
				var h = "";
				if (isRunning) {
					h = "<button class='mc-btn-stop' " +
						"onclick='stopRun()'" +
						(_system.inTransition ? " disabled" : "") +
						">Stop Run</button>";
				} else if (canStart) {
					var onclick = (_system.state === "Halted") ?
						"startFromHalted()" : "promptLogAndStart(false)";
					h = "<button class='mc-btn-start' " +
						"onclick='" + onclick + "'" +
						(_system.inTransition ? " disabled" : "") +
						">Start Run</button>";
				}
				mcRunBtn.innerHTML = h;
			}

			// FSM transition buttons (Configure, Halt — no Start/Stop)
			var mcActions = document.getElementById("mc-actions");
			if (mcActions) {
				var valid = _TRANSITIONS[_system.state] || [];
				var h = "";
				var isRunning = _system.state === "Running" || _system.state === "Paused";
				for (var i = 0; i < valid.length; ++i) {
					var action = valid[i];
					if (action === "Start" || action === "Stop") continue;
					if (action === "Halt" && isRunning) continue;
					h += "<button class='mc-btn' " +
						"onclick=\"systemTransition('" + action + "')\"" +
						(_system.inTransition ? " disabled" : "") +
						">" + action + "</button>";
				}
				mcActions.innerHTML = h;
			}

			// Freeze Run Type when not in Halted/Initial
			var fsmSelect = document.getElementById("fsmSelect");
			if (fsmSelect) {
				var canChange = (_system.state === "Halted" || _system.state === "Initial");
				fsmSelect.disabled = !canChange;
			}

		}

		// =============================================================
		// Config section — Run Type selector
		// =============================================================
		function renderConfigSection() {
			// Set default alias if none selected
			if (!_system.selectedAlias && _systemAliases.length)
				_system.selectedAlias = _systemAliases[0].name;

			var el = document.getElementById("configContent");
			var html = "";
			html += "<label>Run Type:</label>";
			html += "<select id='fsmSelect' onchange='onFsmChange(this.value)'>";
			for (var i = 0; i < _fsmNames.length; ++i) {
				var sel = _fsmNames[i] === _fsmName ? " selected" : "";
				html += "<option value='" + Mu2e.escAttr(_fsmNames[i]) + "'" + sel + ">" +
					Mu2e.esc(_fsmNames[i]) + "</option>";
			}
			html += "</select>";
			el.innerHTML = html;
		}

		function onFsmChange(value) {
			_fsmName = value;
			loadSubsystems();
		}

		function onSystemAliasChange(value) {
			_system.selectedAlias = value;
		}

		// =============================================================
		// Subsystem table
		// =============================================================
		function renderSubsystemTable() {
			var el = document.getElementById("subsystemContent");
			if (!_subsystems.length) {
				el.innerHTML = "<div class='placeholder-text'>No subsystems found.</div>";
				return;
			}

			// Subsystem table
			var html = "<table class='subsystem-grid'>";
			html += "<colgroup>";
			html += "<col style='width:38px;'>";
			html += "<col style='width:160px;'>";
			html += "<col style='width:100px;'>";
			html += "<col style='width:80px;'>";

		// Collect every error a StateMachineXgiHandler / Request response can
		// carry: transport error, <Error> nodes, state_transition_attempted=0
		// with its reason, and Iterator error_message. Returns "" if none.
		function fsmResponseError(req, errStr) {
			var parts = [];
			if (errStr) parts.push(errStr);
			if (!req || !req.responseXML) {
				if (!errStr) parts.push("Empty or illegal XML response from the Gateway.");
				return parts.join("\n\n");
			}
			var errs = DesktopContent.getXMLRequestErrors(req);
			for (var e = 0; e < errs.length; ++e) if (errs[e]) parts.push(errs[e]);

			var attempted = DesktopContent.getXMLValue(req, "state_transition_attempted");
			if (attempted !== undefined && attempted != "1") {
				var why = DesktopContent.getXMLValue(req, "state_transition_attempted_err");
				parts.push("Server indicated failure to attempt state transition." +
					(why ? "\n\n" + why : ""));
			}
			var iterErr = DesktopContent.getXMLValue(req, "error_message");
			if (iterErr) parts.push(iterErr);
			return parts.join("\n\n");
		}

		// =============================================================
		// Actions
		// =============================================================
		function startFromHalted() {
			promptLogAndStart(true);
		}

		// Prompt for log entry then start a run via the Iterator's generated
		// plan (Configure-if-needed + Start). The Iterator itself performs the
		// Configure when needed, so we never chain a separate Configure here.
		//
		// needsConfigure=false means we are in Configured: the plan is told to
		// keep the current configuration (SubsystemLaunch's "Stay Configured").
		function promptLogAndStart(needsConfigure) {
			var keepConfiguration = !needsConfigure;
			DesktopContent.popUpVerification(
				"Please enter a logbook entry for the next run:" +
				(keepConfiguration ?
					"<br><br><span style='font-size:12px; opacity:0.8;'>System is already Configured; " +
					"the run will start without re-configuring.</span>" : ""),
				function (entry) {
					startRun(entry || "", keepConfiguration);
				},
				undefined, "#efeaea", undefined, "#770000",
				true /*getUserInput*/, 500 /*dialogWidth*/,
				function () { Debug.log("Start cancelled."); },
				"Start" /*yesButtonText*/,
				true /*noAutoComplete*/,
				"" /*defaultUserInputValue*/,
				undefined, true /*wantMultilineInput*/
			);
		}

		function startRun(logEntry, keepConfiguration) {
			// If a previous plan is still registered (e.g. left in Error), the
			// Iterator refuses to play; halt it first, then play.
			if (_iterator.activePlan && _iterator.activePlan !== "") {
				if (_iterator.activePlanStatus === "Error") {
					iterateHaltThen(function () { startRun(logEntry, keepConfiguration); });
					return;
				}
				DesktopContent.popUpVerification(
					"There is already an active Iterator plan ('" + Mu2e.esc(_iterator.activePlan) +
					"', status " + Mu2e.esc(_iterator.activePlanStatus || "?") + "); " +
					"do you want to Halt it and then launch the new run?",
					function () {
						iterateHaltThen(function () { startRun(logEntry, keepConfiguration); });
					},
					0, "#efeaea", 0, "#770000");
				return;
			}

			var alias = _system.selectedAlias;
			if (!alias && _systemAliases.length)
				alias = _systemAliases[0].name;

			// Generated-plan CSV consumed by Iterator::playGeneratedIterationPlan():
			//   fsmName, configAlias, durationSeconds, numberOfRuns, keepConfiguration, logEntry
			// durationSeconds must be -1 for an open-ended run: the Iterator then
			// issues a single Start and RELEASES the FSM. Any other value (incl. 0)
			// is a finite run, and the Iterator keeps control of the FSM for the
			// whole run, which makes a later plain Stop be rejected.
			var parameters = "";
			parameters += _fsmName;
			parameters += "," + (alias || "");
			parameters += ",-1";  // durationSeconds (-1 = open-ended)
			parameters += ",1";   // numberOfRuns
			parameters += "," + (keepConfiguration ? "1" : "0");
			parameters += "," + encodeURIComponent(logEntry); // double-encoded by design

			_system.inTransition = true;
			_system.transition = "Launching Start";
			updateStatusBar();

			DesktopContent.XMLHttpRequest(
				"StateMachineXgiHandler?" +
				"&StateMachine=iteratePlayGenerated" +
				"&fsmName=" + _fsmName,
				"&fsmWindowName=" + encodeURIComponent(parameters),
				function (req, reqParam, errStr) {
					var err = fsmResponseError(req, errStr);
					if (err) {
						Debug.err("Start failed: " + err);
						pollSoon(500);
						return;
					}
					Debug.log("Run launched via Iterator.");
					pollSoon(1000);
				},
				0, 0, true, false, true);
		}

		// Send iterateHalt, then wait for the Iterator to report no active plan
		// before calling onDone. Reports rejection instead of ignoring it.
		function iterateHaltThen(onDone) {
			DesktopContent.XMLHttpRequest(
				"StateMachineXgiHandler?fsmName=" + _fsmName +
				"&StateMachine=iterateHalt", "",
				function (req, reqParam, errStr) {
					var err = fsmResponseError(req, errStr);
					if (err) {
						Debug.err("Halting the Iterator failed: " + err);
						pollSoon(500);
						return;
					}
					pollSoon(500);
					var tries = 0;
					var wait = function () {
						if (!_iterator.activePlan || _iterator.activePlan === "") {
							if (onDone) onDone();
							return;
						}
						if (++tries > 15) {
							Debug.err("Something is wrong! Unable to halt the Iterator... " +
								"please contact admins.");
							return;
						}
						setTimeout(wait, 1000);
					};
					setTimeout(wait, 1500);
				},
				0, 0, true, false, true);
		}

		var _pendingDiscardRun = false;
		var _pendingWriteToEcl = false;

		function stopRun() {
			_pendingDiscardRun = false;
			_pendingWriteToEcl = false;
			DesktopContent.popUpVerification(
				"Please enter a logbook entry to end this run:" +
				"<br><br><label style='cursor:pointer;'><input type='checkbox' " +
				"id='Mu2eRunControl-writeToEcl' onchange='_pendingWriteToEcl=this.checked;' /> Write end-of-run summary to ECL</label>" +
				"<br><label style='cursor:pointer;'><input type='checkbox' " +
				"id='Mu2eRunControl-discardRun' onchange='_pendingDiscardRun=this.checked;' /> Discard run for processing</label>",
				function (entry) {
					var discardRun = _pendingDiscardRun || false;
					var writeToEcl = _pendingWriteToEcl || false;

					var sendStop = function () {
						_system.inTransition = true;
						_system.transition = "Launching Stop";
						updateStatusBar();
						DesktopContent.XMLHttpRequest(
							"StateMachineXgiHandler?fsmName=" + _fsmName +
							"&StateMachine=Stop",
							"logEntry=" + encodeURIComponent(entry || "") +
							"&writeToEcl=" + (writeToEcl ? "1" : "0") +
							"&discardRun=" + (discardRun ? "1" : "0"),
							function (req, reqParam, errStr) {
								var err = fsmResponseError(req, errStr);
								if (err) {
									Debug.err("Stop failed: " + err);
									pollSoon(500);
									return;
								}
								Debug.log("Run stop launched.");
								pollSoon(1000);
							},
							0, 0, true, false, true);
					};

					// With an open-ended run the Iterator has already released the
					// FSM, so a plain Stop is correct and carries the log entry and
					// ECL/discard flags. Only if the Iterator still owns the FSM
					// (e.g. a finite plan is in progress) do we halt it first; the
					// Iterator itself then Aborts the run, so warn the user.
					if (iteratorHasControl()) {
						DesktopContent.popUpVerification(
							"The Iterator is still in control of the run (plan '" +
							Mu2e.esc(_iterator.activePlan) + "'). Stopping now will halt the " +
							"Iterator, which <b>aborts</b> the run rather than a clean Stop; " +
							"the log entry and ECL/discard options will not be applied.<br><br>" +
							"Continue anyway?",
							function () { iterateHaltThen(function () { pollSoon(500); }); },
							0, "#efeaea", 0, "#770000");
						return;
					}
					sendStop();
				},
				undefined, "#efeaea", undefined, "#770000",
				true /*getUserInput*/, 500 /*dialogWidth*/,
				function () { Debug.log("Stop cancelled."); },
				"Stop Run" /*yesButtonText*/,
				true /*noAutoComplete*/,
				"" /*defaultUserInputValue*/,
				undefined, true /*wantMultilineInput*/
			);
		}

		function systemTransition(command, onDone) {
			console.log("systemTransition:", command, "fsmName:", _fsmName,
				"state:", _system.state, "fsmWindow:", _system.activeFsmWindow);

			var sendCommand = function () {
				var postData = "";
				if (command === "Configure") {
					var alias = _system.selectedAlias;
					if (!alias && _systemAliases.length)
						alias = _systemAliases[0].name;
					if (alias)
						postData = "ConfigurationAlias=" + encodeURIComponent(alias);
				}

				_system.inTransition = true;
				_system.transition = "Launching " + command;
				updateStatusBar();

				DesktopContent.XMLHttpRequest(
					"StateMachineXgiHandler?fsmName=" + _fsmName +
					"&StateMachine=" + command,
					postData,
					function (req, reqParam, errStr) {
						var err = fsmResponseError(req, errStr);
						if (err) {
							console.log("systemTransition ERROR:", command, err);
							Debug.err("Transition " + command + " failed: " + err);
							pollSoon(500);
							return;
						}
						console.log("systemTransition OK:", command);
						pollSoon(1000);
						if (onDone) onDone();
					},
					0, 0, true, false, true);
			};

			// Halt while the Iterator owns the FSM: the Gateway would reject a
			// direct Halt, so halt the Iterator first (it Halts/Aborts the FSM
			// itself), then follow with a Halt only if the FSM is not yet Halted.
			if (command === "Halt" && iteratorHasControl()) {
				iterateHaltThen(function () {
					var retries = 15;
					var wait = function () {
						if (_system.state === "Halted" || _system.state === "Initial") {
							if (onDone) onDone();
							return;
						}
						if (_system.inTransition && retries-- > 0) {
							setTimeout(wait, 2000);
							return;
						}
						sendCommand();
					};
					setTimeout(wait, 2000);
				});
				return;
			}

			sendCommand();
		}

		function subsystemAction(idx, command) {
			var ss = _subsystems[idx];
			var param = "";
			if (command === "Configure" && ss.configAlias)
				param = "&parameter=" + encodeURIComponent(ss.configAlias);

			// Immediate feedback; the poll will overwrite with the real status
			ss.status = "Launching " + command;
			ss.progress = 0;
			updateSubsystemRows();

			DesktopContent.XMLHttpRequest(
				"Request?RequestType=commandRemoteSubsystem" +
				"&fsmName=" + _fsmName +
				"&command=" + command +
				"&targetSubsystem=" + encodeURIComponent(ss.name) + param, "",
				function (req, reqParam, errStr) {
					var err = fsmResponseError(req, errStr);
					if (err)
						Debug.err("Error received launching '" + command + "' on Subsystem '" +
							ss.name + "': " + err);
					pollSoon(err ? 500 : 1500);
				},
				0, 0, true, true, true);
		}

		function onSubsystemAliasChange(idx, value) {
			var ss = _subsystems[idx];
			ss.configAlias = value;
			ss._pendingConfigAlias = value; // suppress "changed server-side" warning
			DesktopContent.XMLHttpRequest(
				"Request?RequestType=setRemoteSubsystemFsmControl" +
				"&targetSubsystem=" + encodeURIComponent(ss.name) +
				"&controlType=configAlias" +
				"&setValue=" + encodeURIComponent(value), "",
				function (req, reqParam, errStr) {
					var err = fsmResponseError(req, errStr);
					if (err) {
						delete ss._pendingConfigAlias;
						Debug.err("Failed to set Configure Alias '" + value +
							"' for Subsystem '" + ss.name + "': " + err);
					}
					pollSoon(500);
				},
				0, 0, true, true, true);
		}

		function toggleInclude(idx) {
			var ss = _subsystems[idx];

			ss.fsmIncluded = newVal;

			var btn = document.getElementById("ss-incl-" + idx);

			var row = document.getElementById("ss-row-" + idx);

			// Update system overview dimming

			// Errors are suppressed while excluded; surface the current one
			// (as a warning, it is not new) when the user includes it again.

				var rawErr = ss.status + (ss.error ? ":::" + ss.error : "");
				Debug.warn("Subsystem '" + ss.name + "' is now INCLUDED and is in state '" +
					ss.status + "'. Here is its current error for reference:\n\n" +
					Mu2e.decodeDetail(rawErr));

			DesktopContent.XMLHttpRequest(
				"Request?RequestType=setRemoteSubsystemFsmControl" +
				"&targetSubsystem=" + encodeURIComponent(ss.name) +
				"&controlType=include&setValue=" + newVal, "",
				function (req, reqParam, errStr) {
					var err = fsmResponseError(req, errStr);
					if (err) {
						delete ss._pendingInclude;
						Debug.err("Failed to " + (newVal ? "include" : "exclude") +
							" Subsystem '" + ss.name + "': " + err);
					}
					pollSoon(500);
				},
				0, 0, true, true, true);
		}

		function bootSubsystem(idx) {

					DesktopContent.XMLHttpRequest(

				false /*getUserInput*/, 350 /*dialogWidth*/);

		// =============================================================
		// TRIGGER MENU — compact selector for the Trigger subsystem's
		// artdaq system variables (triggerMenuName / triggerMenuTag /
		// outputBaseDir), the same ones the Trigger Menu Editor edits.
		// -------------------------------------------------------------
		// The variables live in the Trigger subsystem's USER_DATA and are
		// served by ITS ConfigurationGUISupervisor (getArtdaqSystemVariables,
		// setArtdaqSystemVariable, getJsonDocuments), i.e. behind a different
		// Gateway than this page. We reach it the same way a remote desktop
		// window does: take the browser-reachable, port-translated URL of a
		// Trigger-folder icon from the parent desktop's icon map, POST our
		// desktop cookie code to that origin (subsystem supervisors answer
		// with Access-Control-Allow-Origin:* and verify the cookie against
		// the primary Gateway), and target the ConfigurationGUI LID.
		// =============================================================
		var _TM_OUTPUT_DIR_DEFAULTS = ["/data/DAQ/dropbox", "/data/mu2e/DAQ/debug"];
		var _TM_VARIABLE_KEYS = ["triggerMenuName", "triggerMenuTag", "outputBaseDir"];
		var _TM_REFRESH_MS = 30000;

		var _tm = {
			endpoint: null,     // {origin, urn, editorUrl}
			vars: {},           // server values keyed by variable
			docs: {},           // docName -> [versions]
			loaded: false,
			busy: false,
			nonce: 0,
			discoverTries: 0,
			refreshTimer: 0,
			editingPath: false
		};

		function triggerSubsystemIndex() {
			for (var i = 0; i < _subsystems.length; ++i)
				if (_subsystems[i].name === "Trigger_Gateway") return i;
			for (var i = 0; i < _subsystems.length; ++i)
				if (/^Trigger/i.test(_subsystems[i].name)) return i;
			return -1;

		function renderTriggerMenuRow() {
			var h = "<tr id='ss-trigmenu-row' class='ss-trigmenu-row'>";
			h += "<td></td>";
			h += "<td colspan='5'>";
			h += "<div class='tm-row' id='tm-controls'>";

				"<option>loading...</option></select>";

				"title='Open the Trigger Menu Editor window (browse menus, edit prescales)'>" +

		function tmStatus(text, cls) {
			var el = document.getElementById("tm-status");
			if (!el) return;
			el.textContent = text || "";
			el.title = text || "";
			el.className = "tm-status" + (cls ? " tm-status-" + cls : "");
		}

		// Locate the Trigger subsystem's ConfigurationGUI endpoint and the
		// Trigger Menu Editor URL via the parent desktop's icon map.
		function tmDiscoverEndpoint() {
			var ss = triggerSubsystem();
			if (!ss) return null;
			var map = getDesktopIconMap();
			if (!map) return null;

			var originOf = function (url) {
				var m = url && url.match(/^(https?:\/\/[^\/]+)/);
				return m ? m[1] : null;
			};

			// 1. The Trigger Menu Editor page only exists on the Trigger gateway,
			//    so its icon (anywhere on the desktop) pins down that gateway's
			//    browser-reachable origin.
			// 2. Otherwise use the Trigger subsystem's landing-page icon. Remote
			//    icons are keyed "<folder>/<caption>" or, when the subsystem icon
			//    sits at the desktop root, "<UserDataPath> <caption>".
			var editorUrl = null, landingUrl = null;
			var lp = ss.landingPage || "";
			for (var key in map) {
				if (!map.hasOwnProperty(key)) continue;
				var url = map[key] && map[key][0];
				if (!url) continue;
				if (!editorUrl && url.indexOf("TriggerMenuEditor") >= 0) editorUrl = url;
				if (!landingUrl && lp && (key === lp ||
						key.substr(-(lp.length + 1)) === "/" + lp ||
						key.substr(-(lp.length + 1)) === " " + lp) &&
						url.indexOf("remoteServerOrigin=") >= 0)
					landingUrl = url;
			}
			var origin = originOf(editorUrl) || originOf(landingUrl);
			if (!origin) return null;

			// ConfigurationGUI on that same origin (for the ?urn= LID)
			var cfgUrl = null, anyRemoteUrl = null;
			for (var key2 in map) {
				if (!map.hasOwnProperty(key2)) continue;
				var url2 = map[key2] && map[key2][0];
				if (!url2 || originOf(url2) !== origin) continue;
				if (!cfgUrl && url2.indexOf("ConfigurationGUI.html") >= 0) cfgUrl = url2;
				if (!anyRemoteUrl && url2.indexOf("remoteServerOrigin=") >= 0) anyRemoteUrl = url2;
			}
			var probe = cfgUrl || editorUrl || landingUrl || anyRemoteUrl;

			// ConfigurationGUI LID: from ?urn=NNN of the Configure icon, else from
			// lid=NNN of the same, else the otsdaq default (281).
			var urn = 0;
			if (cfgUrl) {
				var u = cfgUrl.match(/[?&]urn=(\d+)/) || cfgUrl.match(/lid=(\d+)/);
				if (u) urn = u[1] | 0;
			}
			if (!urn) urn = 281;

			if (!editorUrl) {
				// Fall back to the well-known page path on the Trigger gateway,
				// carrying the remote-gateway params so DesktopContent authenticates.
				var rem = probe.match(/[?&](remoteServerOrigin=[^&]*&remoteServerUrnLid=\d+)/);
				editorUrl = origin + "/WebPath/UserWebPath/html/TriggerMenuEditor.html?urn=" + urn +
					(rem ? "&" + rem[1] : "");
			}
			return { origin: origin, urn: urn, editorUrl: editorUrl };
		}

		// POST a Request to the Trigger ConfigurationGUI supervisor.
		// cb(req, errStr): errStr non-empty on transport/auth/<Error> failure.
		function tmRequest(requestType, postData, cb) {
			var ep = _tm.endpoint;
			if (!ep) { cb(null, "Trigger endpoint not resolved."); return; }
			var cookie = DesktopContent._cookieCodeMailbox || "";
			var body = "RequestOrigin=" + encodeURIComponent(ep.origin) +
				"&CookieCode=" + cookie + (postData ? "&" + postData : "");
			var req = new XMLHttpRequest();
			req.onreadystatechange = function () {
				if (req.readyState !== 4) return;
				if (req.status !== 200) {
					cb(null, "HTTP " + req.status + " from " + ep.origin +
						(req.status === 0 ? " (unreachable, blocked, or connection lost)" : ""));
					return;
				}
				if (req.responseText === Globals.REQ_NO_LOGIN_RESPONSE ||
						req.responseText === Globals.REQ_NO_PERMISSION_RESPONSE) {
					cb(null, "Trigger gateway rejected the request: " + req.responseText +
						". Open any Trigger window once to establish the remote login, then retry.");
					return;
				}
				if (!req.responseXML) { cb(null, "Illegal XML response from Trigger gateway."); return; }
				var errs = DesktopContent.getXMLRequestErrors(req);
				if (errs.length) { cb(req, errs.join("\n")); return; }
				cb(req, "");
			};
			req.onerror = function () { cb(null, "Network error reaching " + ep.origin); };
			try {
				req.open("POST", ep.origin + "/urn:xdaq-application:lid=" + ep.urn +
					"/Request?RequestType=" + requestType, true);
				req.setRequestHeader("Content-Type", "text/plain;charset=UTF-8");
				req.send(body);
			} catch (e) {
				cb(null, "Failed to send request: " + e);
			}
		}

		// Entry point: called after the subsystem table renders. Resolves the
		// endpoint (retrying while the Trigger desktop folder is still loading),
		// then loads variables and menu documents.
		function tmLoad() {
			if (_tm.refreshTimer) { clearTimeout(_tm.refreshTimer); _tm.refreshTimer = 0; }
			if (!document.getElementById("tm-controls")) return;
			var nonce = ++_tm.nonce;

			_tm.endpoint = tmDiscoverEndpoint();
			if (!_tm.endpoint) {
				if (++_tm.discoverTries <= 12) {
					tmStatus("waiting for Trigger desktop folder to load...");
					_tm.refreshTimer = setTimeout(function () {
						if (nonce === _tm.nonce) tmLoad();
					}, 5000);
				} else {
					tmStatus("Trigger subsystem icons not available on this desktop; " +
						"open the Trigger folder once and reload.", "err");
				}
				return;
			}
			_tm.discoverTries = 0;
			tmFetch(nonce);
		}

		function tmFetch(nonce) {
			var pending = 2, failed = "";
			var done = function () {
				if (--pending) return;
				if (nonce !== _tm.nonce) return;
				if (failed) { tmStatus(failed, "err"); }
				else {
					_tm.loaded = true;
					tmRender();
					tmStatus("");
				}
				tmUpdateEnabled();
				_tm.refreshTimer = setTimeout(function () {
					if (nonce === _tm.nonce && !tmIsDirty() && !_tm.busy) tmFetch(nonce);
				}, _TM_REFRESH_MS);
			};

			tmRequest("getArtdaqSystemVariables", "", function (req, err) {
				if (err) failed = err;
				else {
					var vars = {};
					var dataEl = req.responseXML.getElementsByTagName("DATA")[0];
					var kids = dataEl ? dataEl.childNodes : [];
					for (var i = 0; i < kids.length; ++i) {
						var n = kids[i];
						if (n.nodeType !== 1) continue;
						var tag = n.nodeName || n.tagName;
						if (!tag || tag.indexOf("artdaq_") !== 0) continue;
						vars[tag.substring(7)] = n.getAttribute("value") || n.textContent || "";
					}
					_tm.vars = vars;
				}
				done();
			});
			tmRequest("getJsonDocuments", "", function (req, err) {
				if (err) failed = failed || err;
				else {
					var docs = {};
					var names = req.responseXML.getElementsByTagName("jsonDoc_name");
					var vers = req.responseXML.getElementsByTagName("jsonDoc_versions");
					for (var i = 0; i < names.length; ++i) {
						var nm = names[i].getAttribute("value") || "";
						var vs = vers[i] ? (vers[i].getAttribute("value") || "") : "";
						docs[nm] = vs ? vs.split(",") : [];
					}
					_tm.docs = docs;
				}
				done();
			});
		}

		function tmFillSelect(sel, values, selected) {
			sel.innerHTML = "";
			for (var i = 0; i < values.length; ++i) {
				var o = document.createElement("option");
				o.value = values[i];
				o.textContent = values[i];
				sel.appendChild(o);
			}
			if (selected !== undefined && values.indexOf(selected) >= 0) sel.value = selected;
		}

		// Populate the controls from _tm.vars / _tm.docs (server truth).
		function tmRender() {
			var menuEl = document.getElementById("tm-menu");
			var tagEl = document.getElementById("tm-tag");
			var outEl = document.getElementById("tm-out");
			if (!menuEl || !tagEl || !outEl) return;

			var names = Object.keys(_tm.docs).sort();
			var curMenu = _tm.vars.triggerMenuName || "";
			if (curMenu && names.indexOf(curMenu) < 0) names.unshift(curMenu); // keep unknown current
			tmFillSelect(menuEl, names, curMenu);
			tmRenderTags(_tm.vars.triggerMenuTag || "");

			var outs = _TM_OUTPUT_DIR_DEFAULTS.slice();
			var curOut = _tm.vars.outputBaseDir || "";
			if (curOut && outs.indexOf(curOut) < 0) outs.push(curOut);
			tmFillSelect(outEl, outs, curOut);

			// leave edit mode if we were in it
			var edit = document.getElementById("tm-out-edit");
			var btn = document.getElementById("tm-out-editbtn");
			if (edit && btn) {
				edit.style.display = "none";
				outEl.style.display = "";
				btn.textContent = "Edit";
				_tm.editingPath = false;
			}
			tmMarkDirty();
		}

		function tmRenderTags(preferred) {
			var menuEl = document.getElementById("tm-menu");
			var tagEl = document.getElementById("tm-tag");
			if (!menuEl || !tagEl) return;
			var versions = (_tm.docs[menuEl.value] || []).slice();
			if (preferred && versions.indexOf(preferred) < 0 && menuEl.value === _tm.vars.triggerMenuName)
				versions.unshift(preferred);
			tmFillSelect(tagEl, versions, preferred);
			if (!preferred && versions.length) tagEl.value = versions[versions.length - 1]; // newest
		}

		// Selecting a menu re-populates the tag list (newest tag preselected),
		// then both menu and tag are saved together so they never disagree.
		function tmOnMenuChange() {
			var menuEl = document.getElementById("tm-menu");
			var same = menuEl && menuEl.value === _tm.vars.triggerMenuName;
			tmRenderTags(same ? (_tm.vars.triggerMenuTag || "") : "");
			tmOnChange();
		}

		// Auto-apply: any change is saved immediately. Controls are only
		// enabled while Trigger is not Configured/Running/Paused, and the
		// values take effect at the next Configure, so there is nothing to
		// gain from a separate Apply step.
		function tmOnChange() {
			// Re-check the lock at save time: a transition may have started
			// between the poll that enabled the controls and this click.
			var reason = tmFrozenReason();
			if (reason) {
				Debug.warn("Trigger menu change not applied. " + reason);
				tmRender(); // revert to server values
				return;
			}
			tmMarkDirty();
			var changes = tmChanges();
			if (changes.length && !_tm.busy) tmSave(changes, []);
		}

		function tmCurrentOutput() {
			var edit = document.getElementById("tm-out-edit");
			var outEl = document.getElementById("tm-out");
			if (_tm.editingPath && edit) return edit.value.trim();
			return outEl ? outEl.value : "";
		}

		function tmSelection() {
			var menuEl = document.getElementById("tm-menu");
			var tagEl = document.getElementById("tm-tag");
			return {
				triggerMenuName: menuEl ? menuEl.value : "",
				triggerMenuTag: tagEl ? tagEl.value : "",
				outputBaseDir: tmCurrentOutput()
			};
		}

		function tmChanges() {
			var sel = tmSelection(), changes = [];
			for (var i = 0; i < _TM_VARIABLE_KEYS.length; ++i) {
				var k = _TM_VARIABLE_KEYS[i];
				if (sel[k] !== "" && sel[k] !== (_tm.vars[k] || ""))
					changes.push({ key: k, from: _tm.vars[k] || "", to: sel[k] });
			}
			return changes;
		}

		function tmIsDirty() { return _tm.loaded && tmChanges().length > 0; }

		function tmMarkDirty() {
			var changes = tmChanges();
			var dirtyKeys = {};
			for (var i = 0; i < changes.length; ++i) dirtyKeys[changes[i].key] = true;
			var ids = { triggerMenuName: "tm-menu", triggerMenuTag: "tm-tag", outputBaseDir: "tm-out" };
			for (var k in ids) {
				var el = document.getElementById(ids[k]);
				if (el) el.className = "tm-select" + (dirtyKeys[k] ? " tm-dirty" : "");
			}
			var edit = document.getElementById("tm-out-edit");
			if (edit) edit.className = "tm-input" + (dirtyKeys.outputBaseDir ? " tm-dirty" : "");
			tmUpdateEnabled();
		}

		// Controls are frozen while the Trigger subsystem is Configured/Running/
		// Paused: the variables are resolved at Configure time, so a change can
		// only take effect after a Halt + Configure anyway.
		// The menu may only be changed while the Trigger subsystem is settled in
		// Halted/Initial/Failed and the top-level FSM is idle. Any other state,
		// or any transition in progress anywhere (Configuring, Starting,
		// Stopping, Halting, "Launching ..."), locks the controls: the variables
		// are read during Configure, and a change mid-transition could be picked
		// up half-way or lost.
		function tmFrozenReason() {
			var ss = triggerSubsystem();
			if (!ss) return "";
			var st = ss.status || "";
			var settledEditable = (st === "Halted" || st === "Initial" || st === "Failed" ||
				st === "Error" || st === "Soft-Error" || st === "UNKNOWN" || st === "");
			// Transition names: Configuring, Starting, "Starting Up", Stopping,
			// Halting, Pausing, Resuming, Aborting, plus our local "Launching X"
			// and "Rebooting" placeholders.
			var ssInTransition = (ss.progress > 0 && ss.progress < 100) ||
				/^(Launching|Configuring|Starting|Stopping|Halting|Pausing|Resuming|Aborting|Shutting|Rebooting)\b/.test(st);
			if (ssInTransition)
				return "Trigger is in transition (" + st + "): wait for it to settle.";
			if (!settledEditable)
				return "Trigger is " + st + ": Halt the Trigger subsystem to change the trigger menu " +
					"(variables are applied at Configure).";
			if (_system.inTransition)
				return "System is " + (_system.transition || "in transition") +
					": wait for the transition to finish.";
			return "";
		}

		function tmUpdateEnabled() {
			if (!document.getElementById("tm-controls")) return;
			var reason = tmFrozenReason();
			var frozen = reason !== "";
			var ready = _tm.loaded && !_tm.busy;

			// If we get frozen mid-edit of the output path, drop the edit.
			if (frozen && _tm.editingPath) tmTogglePathEdit(true);

			var ids = ["tm-menu", "tm-tag", "tm-out", "tm-out-edit", "tm-out-editbtn"];
			for (var i = 0; i < ids.length; ++i) {
				var el = document.getElementById(ids[i]);
				if (el) {
					el.disabled = !ready || frozen;
					el.title = frozen ? reason : "";
				}
			}
			var ctl = document.getElementById("tm-controls");
			if (ctl) ctl.title = reason;
			var row = document.getElementById("ss-trigmenu-row");
			if (row) row.className = "ss-trigmenu-row" + (frozen ? " ss-trigmenu-frozen" : "");
		}

		// Edit -> free-text output path; Done/Enter commits (and saves), Escape cancels.
		function tmTogglePathEdit(cancel) {
			var outEl = document.getElementById("tm-out");
			var edit = document.getElementById("tm-out-edit");
			var btn = document.getElementById("tm-out-editbtn");
			if (!outEl || !edit || !btn) return;
			if (!_tm.editingPath) {
				edit.value = outEl.value;
				outEl.style.display = "none";
				edit.style.display = "";
				btn.textContent = "Done";
				_tm.editingPath = true;
				edit.focus();
				return;
			}
			var val = cancel ? "" : edit.value.trim();
			edit.style.display = "none";
			outEl.style.display = "";
			btn.textContent = "Edit";
			_tm.editingPath = false;
			if (val) {
				var found = false;
				for (var i = 0; i < outEl.options.length; ++i)
					if (outEl.options[i].value === val) { found = true; break; }
				if (!found) {
					var o = document.createElement("option");
					o.value = val; o.textContent = val;
					outEl.appendChild(o);
				}
				outEl.value = val;
			}
			tmOnChange();
		}

		function tmSave(remaining, errors) {
			if (!remaining.length) {
				_tm.busy = false;
				if (errors.length) {
					tmStatus("save failed: " + errors.join("; "), "err");
					Debug.err("Failed to save Trigger menu variables:\n\n" + errors.join("\n"));
				} else {
					tmStatus("saved " + new Date().toLocaleTimeString() +
						" (applies at next Trigger Configure)", "ok");
				}
				tmFetch(++_tm.nonce); // re-read server truth
				return;
			}
			_tm.busy = true;
			tmUpdateEnabled();
			var c = remaining.shift();
			tmStatus("saving " + c.key + "...");
			tmRequest("setArtdaqSystemVariable",
				"key=" + encodeURIComponent(c.key) + "&value=" + encodeURIComponent(c.to),
				function (req, err) {
					if (err) errors.push(c.key + ": " + err);
					tmSave(remaining, errors);
				});
		}

		function tmOpenEditor() {
			var ep = _tm.endpoint || tmDiscoverEndpoint();
			if (!ep || !ep.editorUrl) {
				Debug.err("Cannot open the Trigger Menu Editor: the Trigger subsystem's desktop " +
					"icons are not loaded yet. Open the Trigger folder on the desktop once and retry.");
				return;
			}
			openOtsDesktopWindow("Trigger Menu Editor", ep.editorUrl);
		}

		// =============================================================
		// System Overview — per-subsystem active context/config group summary
		// =============================================================
		function loadSystemOverview() {
			renderSystemOverview();
		}

		function renderSystemOverview() {
			var el = document.getElementById("systemOverviewContent");
			if (!_subsystems.length) {
				el.innerHTML = "<div class='placeholder-text'>No subsystems found.</div>";
				return;
			}

			var html = "<table class='sysoverview-grid'>";
			html += "<thead><tr>";
			html += "<th>Subsystem</th>";
			html += "<th>Status</th>";
			html += "<th>Context Group</th>";
			html += "<th>Config Group</th>";
			html += "</tr></thead><tbody>";

			for (var i = 0; i < _subsystems.length; ++i)
				html += renderSystemOverviewRow(_subsystems[i]);

			html += "</tbody></table>";
			el.innerHTML = html;

		function renderSystemOverviewRow(ss) {
			var isUnknown = (ss.status === "UNKNOWN" || !ss.status);
			var h = "<tr class='" + (isUnknown ? "sysoverview-dimmed" : "") + "'>";

			// Config group: prefer the live active group; if none yet (not configured),
			// fall back to the selected alias's resolved group, shown as "pending".
			var configCell;
			if (ss.activeConfigGroupName)
				configCell = formatGroupCell(ss.activeConfigGroupName, ss.activeConfigGroupKey);
			else if (ss.selectedConfigGroupName)
				configCell = formatGroupCell(ss.selectedConfigGroupName, ss.selectedConfigGroupKey, true);
			else
				configCell = formatGroupCell();

			h += "<td class='sysoverview-host'>" + Mu2e.esc(ss.name) + "</td>";
			h += "<td>" + Mu2e.esc(ss.status || "UNKNOWN") + "</td>";
			h += "<td class='sysoverview-cell'>" + formatGroupCell(ss.activeContextGroupName, ss.activeContextGroupKey) + "</td>";
			h += "<td class='sysoverview-cell'>" + configCell + "</td>";

			h += "</tr>";
			return h;
		}

		function formatGroupCell(groupName, groupKey, pending) {
			if (!groupName) return "<span class='sysoverview-empty'>&mdash;</span>";
			var h = Mu2e.esc(groupName) + " <span class='sysoverview-roc-count'>(" + Mu2e.esc(groupKey) + ")</span>";
			if (pending) h += " <span class='sysoverview-subsystem'>pending</span>";
			return h;
		}

		// =============================================================
		// ARTDAQ Node Grid — hosts × process types, merged across subsystems
		// =============================================================
		var _ARTDAQ_TYPES = ["reader", "builder", "supervisor", "logger", "dispatcher", "router", "monitor"];
		var _ARTDAQ_GRID_COLUMNS = ["reader", "builder", "infrastructure", "dqm"];
		var _ARTDAQ_GRID_COLUMN_LABELS = {
			reader: "Reader", builder: "Builder",
			infrastructure: "Infrastructure", dqm: "DQM"
		};
		var _ARTDAQ_TYPE_TO_COLUMN = {
			reader: "reader", builder: "builder",
			supervisor: "infrastructure", logger: "infrastructure",
			dispatcher: "infrastructure", router: "infrastructure",
			monitor: "dqm"
		};

		// Resolved groups (active or pending-selected) arrive over the 1s status
		// poll, a request/response cycle or two after a Configure/dropdown change --
		// getArtdaqNodes itself is a real table-group load server-side, so we only
		// want to re-fetch when the resolved signature actually changes, not on
		// every poll tick.
		var _artdaqGridSignature = "";

		function subsystemArtdaqSignature(ss) {
			var cfgName = ss.activeConfigGroupName || ss.selectedConfigGroupName;
			var cfgKey  = ss.activeConfigGroupName ? ss.activeConfigGroupKey : ss.selectedConfigGroupKey;
			return ss.name + "|" + cfgName + "(" + cfgKey + ")|" +
				ss.activeContextGroupName + "(" + ss.activeContextGroupKey + ")";
		}

		function computeArtdaqGridSignature() {
			var sig = "";
			for (var i = 0; i < _subsystems.length; ++i)
				sig += subsystemArtdaqSignature(_subsystems[i]) + ";";
			return sig;
		}

		// Called after every poll: cheap signature check, only re-fetches the
		// (expensive) artdaq node grid when a subsystem's resolved group changed.
		function refreshArtdaqGridIfChanged() {
			var sig = computeArtdaqGridSignature();
			if (sig === _artdaqGridSignature) return;
			_artdaqGridSignature = sig;
			loadArtdaqGrid();
		}

		function loadArtdaqGrid() {
			_artdaqGridSignature = computeArtdaqGridSignature();
			// ConfigGuiLid must be discovered (async) before setConfigGuiLid() has
			// anything to apply; do this every call rather than assuming some other
			// caller already triggered discovery first.
			Mu2eHardware.discoverConfigGuiLid(function () {
				doLoadArtdaqGrid();
			});
		}

		var _artdaqGridNonce = 0;

		function doLoadArtdaqGrid() {
			var nonce = ++_artdaqGridNonce;
			var targets = [];
			for (var i = 0; i < _subsystems.length; ++i) {
				var ss = _subsystems[i];
				var cfgName = ss.activeConfigGroupName || ss.selectedConfigGroupName;
				var cfgKey  = ss.activeConfigGroupName ? ss.activeConfigGroupKey : ss.selectedConfigGroupKey;
				var ctxName = ss.activeContextGroupName;
				var ctxKey  = ss.activeContextGroupKey;
				if (cfgName && ctxName)
					targets.push({ ss: ss, cfgName: cfgName, cfgKey: cfgKey, ctxName: ctxName, ctxKey: ctxKey });
			}

			if (!targets.length) {
				var el = document.getElementById("artdaqGridContent");
				if (el) el.innerHTML = "<div class='placeholder-text'>No subsystems with a resolved context+config group yet.</div>";
				return;
			}

			// hostname -> { type -> [ {status, subsystemName, artdaqSubsystem} ] }
			var hosts = {};
			var remaining = targets.length;

			targets.forEach(function (t) {
				Mu2eHardware.setConfigGuiLid();
				DesktopContent.XMLHttpRequest(
					"Request?RequestType=getArtdaqNodes" +
					"&tableGroup=" + encodeURIComponent(t.cfgName) +
					"&tableGroupKey=" + encodeURIComponent(t.cfgKey) +
					"&contextGroup=" + encodeURIComponent(t.ctxName) +
					"&contextGroupKey=" + encodeURIComponent(t.ctxKey) +
					"&suppressMultiNode=1",
					"modifiedTables=",
					function (req, reqParam, errStr) {
						if (nonce !== _artdaqGridNonce) return;
						var xml = req && req.responseXML;
						if (!errStr && xml)
							mergeArtdaqNodesXML(xml, t, hosts);
						if (--remaining === 0)
							renderArtdaqGrid(hosts);
					},
					0, 0, true, true);
			});
		}

		function mergeArtdaqNodesXML(xml, target, hosts) {
			var subsystemName = target.ss.name;

			// Extract artdaqSupervisor (DAQInterface) entry
			var supEls = xml.getElementsByTagName("artdaqSupervisor");
			if (supEls.length > 0) {
				var supStatus = xml.getElementsByTagName("artdaqSupervisor-status");
				var supAddr   = xml.getElementsByTagName("artdaqSupervisor-contextAddress");
				var supName   = supEls[0].getAttribute("value") || "ARTDAQSupervisor";
				var status    = supStatus.length ? supStatus[0].getAttribute("value") : "0";
				var addr      = supAddr.length ? supAddr[0].getAttribute("value") : "";
				var hostname  = addr.replace(/^https?:\/\//, "").replace(/(-data)?\.fnal\.gov$/i, "");

				if (hostname) {
					var col = _ARTDAQ_TYPE_TO_COLUMN["supervisor"];
					if (!hosts[hostname]) hosts[hostname] = {};
					if (!hosts[hostname][col]) hosts[hostname][col] = [];
					hosts[hostname][col].push({
						label: supName,
						type: "supervisor",
						hostname: hostname,
						status: status,
						subsystemName: subsystemName,
						subsystemLandingPage: target.ss.landingPage,
						artdaqSubsystem: "",
						cfgName: target.cfgName,
						cfgKey: target.cfgKey
					});
				}
			}

			for (var ti = 0; ti < _ARTDAQ_TYPES.length; ++ti) {
				var type = _ARTDAQ_TYPES[ti];
				var labelNodes      = xml.getElementsByTagName(type);
				var statusNodes     = xml.getElementsByTagName(type + "-status");
				var hostnameNodes   = xml.getElementsByTagName(type + "-hostname");
				var artSubNodes     = xml.getElementsByTagName(type + "-subsystem");

				for (var i = 0; i < hostnameNodes.length; ++i) {
					// hostnames are stored URI-encoded internally (dashes/dots would
					// otherwise confuse artdaq's multi-node "printer syntax" compression
					// elsewhere) -- decode for display/grouping here.
					var hostname = hostnameNodes[i].getAttribute("value");
					if (!hostname) continue;
					try { hostname = decodeURIComponent(hostname); } catch (e) { }
					hostname = hostname.replace(/(-data)?\.fnal\.gov$/i, "");

					var col = _ARTDAQ_TYPE_TO_COLUMN[type] || type;
					if (!hosts[hostname]) hosts[hostname] = {};
					if (!hosts[hostname][col]) hosts[hostname][col] = [];

					// label carries a ";status=0/1" suffix baked in server-side to keep
					// map keys unique -- strip it for display, we already have status
					// from the separate -status field.
					var label = labelNodes[i] ? labelNodes[i].getAttribute("value") : "";
					var statusSuffixIdx = label.lastIndexOf(";status=");
					if (statusSuffixIdx >= 0) label = label.substring(0, statusSuffixIdx);

					hosts[hostname][col].push({
						label: label,
						type: type,
						hostname: hostname,
						status: statusNodes[i] ? statusNodes[i].getAttribute("value") : "",
						subsystemName: subsystemName,
						subsystemLandingPage: target.ss.landingPage,
						artdaqSubsystem: artSubNodes[i] ? artSubNodes[i].getAttribute("value") : "",
						cfgName: target.cfgName,
						cfgKey: target.cfgKey
					});
				}
			}
		}

		// Group hosts by naming pattern (mu2e-<group>-NN) for display ordering.
		var _HOST_GROUP_ORDER = ["cfo", "calo", "trk", "crv", "dl", "dcs"];
		function hostGroupRank(hostname) {
			var m = hostname.match(/^mu2e-?([a-z]+)/i);
			var group = m ? m[1].toLowerCase() : "";
			var idx = _HOST_GROUP_ORDER.indexOf(group);
			return idx >= 0 ? idx : _HOST_GROUP_ORDER.length;
		}

		function renderArtdaqGrid(hosts) {
			var el = document.getElementById("artdaqGridContent");
			if (!el) return;

			_artdaqNodeRegistry = []; // reset click registry for this render

			var hostnames = Object.keys(hosts).sort(function (a, b) {
				var ra = hostGroupRank(a), rb = hostGroupRank(b);
				if (ra !== rb) return ra - rb;
				return a < b ? -1 : (a > b ? 1 : 0);
			});
			if (!hostnames.length) {
				el.innerHTML = "<div class='placeholder-text'>No artdaq nodes found for any subsystem's active groups.</div>";
				return;
			}

			var html = "<table class='sysoverview-grid'>";
			html += "<thead><tr><th>Host</th>";
			for (var ci = 0; ci < _ARTDAQ_GRID_COLUMNS.length; ++ci)
				html += "<th>" + _ARTDAQ_GRID_COLUMN_LABELS[_ARTDAQ_GRID_COLUMNS[ci]] + "</th>";
			html += "</tr></thead><tbody>";

			for (var hi = 0; hi < hostnames.length; ++hi) {
				var hostname = hostnames[hi];
				html += "<tr><td class='sysoverview-host'>" + Mu2e.esc(hostname) + "</td>";
				for (ci = 0; ci < _ARTDAQ_GRID_COLUMNS.length; ++ci) {
					var entries = hosts[hostname][_ARTDAQ_GRID_COLUMNS[ci]];
					html += "<td class='sysoverview-cell'>" + renderArtdaqCell(entries) + "</td>";
				}
				html += "</tr>";
			}

			html += "</tbody></table>";
			el.innerHTML = html;
		}

		var _ARTDAQ_TYPE_TO_SOURCE = {
			supervisor: "DAQInterface", reader: "BoardReader", builder: "EventBuilder",
			logger: "DataLogger", dispatcher: "Dispatcher",
			monitor: "Monitor", router: "Router"
		};

		var _SS_NAME_TO_LOG_SYSTEM = {
			Trigger_Gateway: "Trigger", Calo_HardwareGateway: "Calo",
			CFO_HardwareGateway: "CFO", CRV_HardwareGateway: "CRV",
			DQM_Gateway: "DQM", STM_Gateway: "STM",
			Tracker_Gateway: "Tracker", DCS_Gateway: "DCS"
		};

		function openSubsystemLog(idx) {
			var ss = _subsystems[idx];
			if (!ss) return;
			var sys = _SS_NAME_TO_LOG_SYSTEM[ss.name] || ss.name.replace(/_.*/, "");
			var url = "/WebPath/UserWebPath/html/Mu2eLogViewer.html" +
				"?system=" + encodeURIComponent(sys) +
				"&source=OTSDAQ" +
				"&level=Info";
			openOtsDesktopWindow(sys + " Log", url);
		}

		function openArtdaqNodeLog(regIdx) {
			var e = _artdaqNodeRegistry[regIdx];
			if (!e) return;
			var sys = _SS_NAME_TO_LOG_SYSTEM[e.subsystemName] || e.subsystemName.replace(/_.*/, "");
			var src = _ARTDAQ_TYPE_TO_SOURCE[e.type] || e.type;
			var url = "/WebPath/UserWebPath/html/Mu2eLogViewer.html" +
				"?system=" + encodeURIComponent(sys) +
				"&source=" + encodeURIComponent(src) +
				"&node=" + encodeURIComponent(e.hostname) +
				"&level=Info";
			if (e.type === "supervisor")
				url = "/WebPath/UserWebPath/html/Mu2eLogViewer.html" +
					"?system=" + encodeURIComponent(sys) +
					"&app=DAQInterface_partition_6" +
					"&level=Info";
			openOtsDesktopWindow(sys + " Log: " + e.label, url);
		}

		var _SS_BG_STATES = ["Initial", "Halted", "Configured", "Running", "Paused", "Error"];
		function getSubsystemStatus(subsystemName) {
			var status = "unknown";
			for (var i = 0; i < _subsystems.length; ++i)
				if (_subsystems[i].name === subsystemName) {
					status = _subsystems[i].status || "unknown";
					break;
				}
			return _SS_BG_STATES.indexOf(status) >= 0 ? status : "unknown";
		}

		// Flat registry of rendered node entries so onclick can reference an entry
		// by index (avoids escaping group/label strings into inline handlers).
		var _artdaqNodeRegistry = [];

		function renderArtdaqCell(entries) {
			if (!entries || !entries.length)
				return "<span class='sysoverview-empty'>&mdash;</span>";

			var h = "";
			for (var i = 0; i < entries.length; ++i) {
				var e = entries[i];
				var isOn = e.status === "1" || e.status === "true";
				var ssStatus = getSubsystemStatus(e.subsystemName);
				var regIdx = _artdaqNodeRegistry.push(e) - 1;
				h += "<div class='sysoverview-item " +
					(isOn ? "ss-bg-" + Mu2e.esc(ssStatus) : "ss-bg-disabled") + "'>";
				h += "<span class='sysoverview-item-clickable'" +
					" title='" + Mu2e.escAttr(e.subsystemName + " — click to open FHiCL") + "'" +
					" onclick='openArtdaqNodeFcl(" + regIdx + ")'>";
				h += "<span class='status-dot " + (isOn ? "status-on" : "status-off") + "'></span>";
				h += Mu2e.esc(e.label || "?");
				h += "</span>";
				if (isOn)
					h += "<span class='sysoverview-log-link' title='Open log viewer'" +
						" onclick='openArtdaqNodeLog(" + regIdx + ")'>&#x1f4cb;</span>";
				h += "</div>";
			}
			return h;
		}

		// =============================================================
		// Opening a subsystem app for an artdaq node (config / FHiCL)
		// -------------------------------------------------------------
		// Clicking a node badge opens one of that node's subsystem apps
		// (ConfigurationGUI or Code Editor). The hard part is that each subsystem
		// is a separate (often remote) gateway reachable only via a port-forwarded
		// localhost URL that the top-level Gateway resolves server-side via its
		// admin port-translation map -- we cannot reconstruct that URL client-side.
		//
		// The trick: the parent OTS desktop already holds those exact, reachable,
		// port-translated URLs in its icon map (built when it rendered the remote
		// subsystem folders). So we:
		//   1. find the subsystem's icon folder from its landingPage
		//      (the landingPage is itself one of that folder's icons),
		//   2. look up the reachable URL for the wanted icon ("Configure" /
		//      "Code Editor") within that folder,
		//   3. append app-specific params and open it as an OTS desktop window.
		//
		// Note: node identity. e.label is the concrete node UID (we request
		// getArtdaqNodes with suppressMultiNode=1, so labels are not wildcards).
		// This is what makes the FHiCL filename (<type>-<uid>.fcl) valid.
		// =============================================================

		// Open a URL as an OTS desktop window via the parent desktop's
		// addWindow(name, subname, url, unique); fall back to a browser tab if the
		// parent desktop object isn't reachable (e.g. page loaded stand-alone).
		function openOtsDesktopWindow(winName, url) {
			try {
				DesktopContent._theDesktopWindow.Desktop.desktop.addWindow(
					winName, "", url, false);
			} catch (err) {
				Debug.log("ArtdaqGrid: desktop addWindow unavailable (" + err +
					"), falling back to new tab.");
				window.open(url, "_blank");
			}
		}

		// Read the parent OTS desktop's icon map, which already holds the exact
		// browser-reachable, port-translated remote URLs (e.g.
		// "Trigger/Configure" -> "http://localhost:3945/...ConfigurationGUI.html
		//  ?urn=281&remoteServerOrigin=...&remoteServerUrnLid=200").
		function getDesktopIconMap() {
			try {
				return DesktopContent._theDesktopWindow.Desktop.desktop.icons.iconNameToPathMap;
			} catch (err) {
				Debug.log("ArtdaqGrid: cannot access desktop icon map: " + err);
				return null;
			}
		}

		// Derive a subsystem's icon folder by locating the icon-map key that matches
		// its landingPage (the landingPage is itself one of that folder's icons).
		function findSubsystemIconFolder(landingPage) {
			var map = getDesktopIconMap();
			if (!map || !landingPage) return null;
			for (var key in map) {
				if (!map.hasOwnProperty(key)) continue;
				if (key === landingPage) {
					var si = key.lastIndexOf("/");
					return si >= 0 ? key.substring(0, si) : "";
				}
				var suffix = "/" + landingPage;
				if (key.length > suffix.length &&
					key.substring(key.length - suffix.length) === suffix)
					return key.substring(0, key.length - suffix.length);
			}
			return null;
		}

		// Return the reachable URL for a named icon within the subsystem's folder
		// (e.g. iconName "Configure" or "Code Editor"). These URLs are already
		// port-translated to browser-reachable form by the desktop icon map.
		function findSubsystemIconUrl(landingPage, iconName) {
			var map = getDesktopIconMap();
			var folder = findSubsystemIconFolder(landingPage);
			if (!map || folder === null) return null;
			var mapKey = folder ? (folder + "/" + iconName) : iconName;
			var entry = map[mapKey];
			return entry ? entry[0] : null;
		}

		// Open the node's subsystem ConfigurationGUI, activating the node's resolved
		// config group and opening its tree view at root (via the autoTreeGroup/
		// autoTreeKey deep-link handled in ConfigurationGUI.html init).
		//
		// NOTE: intentionally parked. Not currently wired to the badge click (the
		// click opens FHiCL, see openArtdaqNodeFcl). Kept for a future config-open
		// affordance (e.g. a second control on the badge or a context menu).
		function openArtdaqNodeConfig(regIdx) {
			var e = _artdaqNodeRegistry[regIdx];
			if (!e) return;

			var url = findSubsystemIconUrl(e.subsystemLandingPage, "Configure");
			if (!url) {
				Debug.err("Cannot open config for '" + e.subsystemName +
					"': no Configure desktop icon found for landing page '" +
					e.subsystemLandingPage + "'. (Is the subsystem's desktop folder loaded?)");
				return;
			}

			// e.cfgName/e.cfgKey is the resolved config group (active, else selected).
			if (e.cfgName && e.cfgKey && e.cfgKey !== "-1") {
				url += (url.indexOf("?") >= 0 ? "&" : "?") +
					"autoTreeGroup=" + encodeURIComponent(e.cfgName) +
					"&autoTreeKey=" + encodeURIComponent(e.cfgKey);
			}

			Debug.log("Opening Configure for " + e.subsystemName + ": " + url);
			openOtsDesktopWindow(e.subsystemName + " Configure", url);
		}

		// Open the node's generated FHiCL file in the subsystem's Code Editor, the
		// same way ConfigurationGUI_artdaq does: CodeEditor with readOnlyMode +
		// startFilePrimary=/$USER_DATA/ARTDAQConfigurations/<type>-<uid>.fcl.
		function openArtdaqNodeFcl(regIdx) {
			var e = _artdaqNodeRegistry[regIdx];
			if (!e) return;

			var baseUrl = findSubsystemIconUrl(e.subsystemLandingPage, "Code Editor");
			if (!baseUrl) {
				Debug.err("Cannot open FHiCL for '" + e.subsystemName +
					"': no Code Editor desktop icon found for landing page '" +
					e.subsystemLandingPage + "'. (Is the subsystem's desktop folder loaded, " +
					"and does its Context include a Code Editor Supervisor?)");
				return;
			}

			// FHiCL filename: /$USER_DATA/ARTDAQConfigurations/<type>-<uid>.fcl
			// (e.label is the concrete node UID -- see suppressMultiNode note above).
			var filename = "/$USER_DATA/ARTDAQConfigurations/" +
				e.type + "-" + e.label + ".fcl";

			var url = baseUrl + (baseUrl.indexOf("?") >= 0 ? "&" : "?") +
				"readOnlyMode=1&startFilePrimary=" + encodeURIComponent(filename);

			Debug.log("Opening FHiCL for " + e.label + " on " + e.subsystemName + ": " + url);
			openOtsDesktopWindow(e.subsystemName + " FHiCL: " + e.label, url);
		}


	</script>
</head>

<body onload='//init() called by DesktopContent.js'>

	<!-- Master Control banner -->
	<div id="masterControl">
		<table class="mc-table"><tbody>
			<tr>
				<td class="mc-td-left">
					<div id="systemState" class="status-state state-unknown">---</div>
					<span class="mc-time" id="timeInState">00:00:00</span>
				</td>
				<td class="mc-td-right">
					<span id="mc-actions"></span>
					<span id="mc-run-btn"></span>
				</td>
			</tr>
			<tr>
				<td class="mc-td-left">
					<span class="mc-run-comment" id="runComment"></span>
				</td>
				<td class="mc-td-right">
					<div id="configContent" class="config-row"></div>
				</td>
			</tr>
		</tbody></table>
	</div>

	<!-- Subsystem grid -->
	<div id="subsystemSection">
		<div id="subsystemContent">
			<span class="placeholder-text">Loading subsystems...</span>
		</div>
	</div>

	<!-- System Overview — debug: per-subsystem active context/config group summary -->
	<div id="systemOverviewSection">
		<div id="systemOverviewContent">
			<span class="placeholder-text">Loading system overview...</span>
		</div>
	</div>

	<!-- ARTDAQ Node Grid — hosts × process types -->
	<div id="artdaqGridSection">
		<div id="artdaqGridContent">
			<span class="placeholder-text">Loading artdaq node grid...</span>
		</div>
	</div>

</body>
</html>
