<!DOCTYPE HTML>
<html lang="en">
<head>
    <title>DCS Monitoring</title>

    <link href='/WebPath/css/fonts.css?family=Inconsolata:400' rel='stylesheet' type='text/css'>
    <link href='/WebPath/css/fonts.css?family=Comfortaa:400' rel='stylesheet' type='text/css'>
    <link rel="stylesheet" type="text/css" href="/WebPath/UserWebPath/css/DCSMonitoring.css">

    <script type="text/JavaScript" src="/WebPath/js/Globals.js"></script>
    <script type="text/JavaScript" src="/WebPath/js/Debug.js"></script>
    <script type="text/JavaScript" src="/WebPath/js/DesktopContent.js"></script>

    <script>

        //functions:
        //	init()
        //	updateClock()
        //	makeMenu()
        //	makeMenuItem(parentEl, item)
        //	toggleGroup(groupEl)
        //	openPage(url)
        //
        /////////////////////////////////////////////////////////////////////////////////////////
        /////////////////////////////////////////////////////////////////////////////////////////

        var PAGES_PATH = "/WebPath/UserWebPath/html/DCSMonitoringPages/";
        var HOME_PAGE = PAGES_PATH + "DCSMonitoringHome.html";

        //the sidebar menu: an entry with a url opens a page in the main frame,
        //	an entry with items is a collapsible group, an empty group is shown as not available yet
        var MENU = [
            { name: "Home", url: HOME_PAGE },
            { name: "DAQ", items: [
                { name: "DAQ-Room health", url: PAGES_PATH + "daq/DaqRoomHealth.html" },
                { name: "DAQ-Room - Grafana", url: "http://localhost:3000/dashboards/f/repository-2710b1e/mu2e-tdaq-grafana-dashboards" },
            ] },
            { name: "DCS", items: [
                { name: "Archiver status", url: "http://localhost:4812/main" },
                { name: "Dashboard", url: "/WebPath/html/SlowControlsDashboard.html?page_name=private/calo_2.bob" },
            ] },
            { name: "STM", items: [] },
            { name: "CRV", items: [] },
            { name: "ECAL", items: [
                { name: "Ecal main", url: PAGES_PATH + "calorimeter/CaloMain.html?readOnlyMode=1&standAloneMode=0" },
            ] },
            { name: "TRK", items: [] },
        ];

        var CLOCK_PERIOD_MS = 1000;

        var _menuItemEls = []; //the elements of the menu entries that open a page, each has a pageUrl


        //=====================================================================================
        //init called once body has loaded
        function init() {
            Debug.log("init() was called");

            updateClock();
            window.setInterval(updateClock, CLOCK_PERIOD_MS);

            makeMenu();
            openPage(HOME_PAGE);
        } //end init()

        //=====================================================================================
        //updateClock ~~
        //	shows the Fermilab local time
        function updateClock() {
            document.getElementById("clock").textContent =
                new Date().toLocaleString("en-GB", { timeZone: "America/Chicago" });
        } //end updateClock()

        //=====================================================================================
        //makeMenu ~~
        //	builds the sidebar from MENU
        function makeMenu() {
            var menuEl = document.getElementById("menu");

            for (var i = 0; i < MENU.length; ++i) {
                if (!MENU[i].items) {
                    makeMenuItem(menuEl, MENU[i]);
                    continue;
                }

                var groupEl = menuEl.appendChild(document.createElement("div"));
                groupEl.className = "group";

                var headEl = groupEl.appendChild(document.createElement("button"));
                headEl.className = "groupHead";
                headEl.onclick = toggleGroup.bind(null, groupEl, undefined /*open*/); //do not take the click event as open
                headEl.appendChild(document.createElement("span")).className = "toggle";
                headEl.appendChild(document.createTextNode(MENU[i].name));

                var itemsEl = groupEl.appendChild(document.createElement("div"));
                itemsEl.className = "groupItems";
                for (var j = 0; j < MENU[i].items.length; ++j)
                    makeMenuItem(itemsEl, MENU[i].items[j]);

                if (!MENU[i].items.length) {
                    var emptyEl = itemsEl.appendChild(document.createElement("div"));
                    emptyEl.className = "empty";
                    emptyEl.textContent = "no pages yet";
                }

                toggleGroup(groupEl, false /*open*/);
            }
        } //end makeMenu()

        //=====================================================================================
        //makeMenuItem ~~
        //	adds to parentEl the button that opens the page of item
        function makeMenuItem(parentEl, item) {
            var el = parentEl.appendChild(document.createElement("button"));
            el.className = "item";
            el.textContent = item.name;
            el.pageUrl = item.url;
            el.onclick = openPage.bind(null, item.url);
            _menuItemEls.push(el);
        } //end makeMenuItem()

        //=====================================================================================
        //toggleGroup ~~
        //	opens or closes a menu group, if open is undefined then it is toggled
        function toggleGroup(groupEl, open) {
            open = groupEl.classList.toggle("open", open);
            groupEl.querySelector(".toggle").textContent = open ? "\u25BC" : "\u25B6";
        } //end toggleGroup()

        //=====================================================================================
        //openPage ~~
        //	opens url in the main frame and marks its menu entry as selected
        //	Note: also called by the pages in the main frame (e.g. DCSMonitoringHome.html)
        function openPage(url) {
            Debug.log("openPage()", url);

            for (var i = 0; i < _menuItemEls.length; ++i) {
                var selected = _menuItemEls[i].pageUrl == url;
                _menuItemEls[i].classList.toggle("selected", selected);

                //make sure the selected entry is visible
                var groupEl = _menuItemEls[i].closest(".group");
                if (selected && groupEl)
                    toggleGroup(groupEl, true /*open*/);
            }

            document.getElementById("mainFrame").src = url;
        } //end openPage()

    </script>
</head>

<body onload='//init() called by DesktopContent.js'>

    <div id="header">
        <span id="title">DCS Monitoring</span>
        <span id="status">Fermilab time <span id="clock"></span></span>
    </div>

    <div id="content">
        <div id="side">
            <div id="logo">
                <img src="/WebPath/images/iconImages/mu2e_logo_oval_small.png" alt="Mu2e">
                <img src="/WebPath/images/otsdaqIcons/logo.png" alt="otsdaq">
            </div>
            <div id="menu"></div>
        </div>
        <iframe id="mainFrame" title="DCS Monitoring page"></iframe>
    </div>

</body>
</html>
